fakty:
  # --- kwoty wolne od zajęcia
  - id: zajecie.minimalne-wynagrodzenie
    rodzaj: kwota
    wartosci:
      - wartosc: 4806.00
      - od: 2027-01-01
        wartosc: 5100.00
    alternatywy: [4666.00, 5300.00]
  - id: zajecie.kwota-wolna-procent
    rodzaj: procent
    wartosci:
      - wartosc: 75
    alternatywy: [50, 100]
  - id: zajecie.kwota-wolna-miesieczna
    rodzaj: kwota
    wartosci:
      - wartosc: 3604.50
      - od: 2027-01-01
        wartosc: 3825.00
    alternatywy: [2403.00, 4806.00]
  - id: zajecie.kwota-wolna-swiadczenia-procent
    rodzaj: procent
    wartosci:
      - wartosc: 100
    alternatywy: [75]
  # --- terminy
  - id: termin.zajecie.powiadomienie-klienta
    rodzaj: termin
    wartosci:
      - wartosc: 3
      - od: 2027-01-01
        wartosc: 2
    alternatywy: [5, 7]
  - id: termin.zajecie.odpowiedz-organowi
    rodzaj: termin
    wartosci:
      - wartosc: 7
    alternatywy: [3, 14]
  - id: termin.zajecie.przekazanie-po-karencji
    rodzaj: termin
    wartosci:
      - wartosc: 3
    alternatywy: [2, 5]
  - id: termin.zajecie.zwolnienie
    rodzaj: termin
    wartosci:
      - wartosc: 2
    alternatywy: [1, 3]
  - id: termin.zajecie.korekta-bledu
    rodzaj: termin
    wartosci:
      - wartosc: 5
    alternatywy: [3, 10]
  - id: termin.zajecie.wniosek-spadkobiercow
    rodzaj: termin
    wartosci:
      - wartosc: 14
    alternatywy: [7, 30]
  - id: termin.zajecie.ponowna-weryfikacja
    rodzaj: termin
    wartosci:
      - wartosc: 30
    alternatywy: [14, 60]
  - id: termin.zajecie.aml-blokada-bank
    rodzaj: tekst
    wartosci:
      - wartosc: "96 godzin"
    alternatywy: ["48 godzin", "72 godziny"]
  - id: termin.zajecie.aml-blokada-prokurator
    rodzaj: tekst
    wartosci:
      - wartosc: "6 miesięcy"
    alternatywy: ["3 miesiące"]
  - id: termin.zajecie.godzina-graniczna
    rodzaj: tekst
    wartosci:
      - wartosc: "15:00"
      - od: 2026-04-01
        wartosc: "14:00"
    alternatywy: ["16:00"]
  - id: okres.zajecie.przechowywanie
    rodzaj: tekst
    wartosci:
      - wartosc: "10 lat"
    alternatywy: ["5 lat", "12 lat"]
  # --- limity
  - id: zajecie.limit-zatwierdzenia-przekazania
    rodzaj: kwota
    wartosci:
      - wartosc: 50000.00
      - od: 2027-01-01
        wartosc: 40000.00
    alternatywy: [20000.00, 100000.00]
  - id: zajecie.limit-kosztow-pogrzebu
    rodzaj: kwota
    wartosci:
      - wartosc: 10000.00
    alternatywy: [8000.00, 15000.00]
  # --- systemy, formularze, kontakt
  - id: zajecie.system-centralny
    rodzaj: tekst
    wartosci:
      - wartosc: "CBS-PRZYKŁAD"
  - id: zajecie.rejestr
    rodzaj: tekst
    wartosci:
      - wartosc: "REZ"
    alternatywy: ["RBL"]
  - id: zajecie.formularz-rejestracji
    rodzaj: tekst
    wartosci:
      - wartosc: "F-OP-21"
  - id: zajecie.formularz-zwolnienia
    rodzaj: tekst
    wartosci:
      - wartosc: "F-OP-22"
  - id: zajecie.formularz-odpowiedzi
    rodzaj: tekst
    wartosci:
      - wartosc: "F-OP-23"
  - id: zajecie.skrzynka
    rodzaj: tekst
    wartosci:
      - wartosc: "zajecia@bank.example"
    alternatywy: ["egzekucje@bank.example"]
  - id: zajecie.skrzynka-aml
    rodzaj: tekst
    wartosci:
      - wartosc: "aml-blokady@bank.example"
