  # --- limity
  - id: limit.taryfa-oszczednosci.lokata-waluta-minimum
    rodzaj: tekst
    wartosci:
      - wartosc: "500 jednostek waluty lokaty"
      - od: 2027-01-01
        wartosc: "300 jednostek waluty lokaty"
    alternatywy: ["1000 jednostek waluty lokaty"]
  - id: limit.taryfa-oszczednosci.lokata-firma-minimalna
    rodzaj: kwota
    wartosci:
      - wartosc: 10000.00
      - od: 2027-01-01
        wartosc: 5000.00
    alternatywy: [1000.00, 20000.00]
  - id: limit.taryfa-oszczednosci.rachunek-firma-otwarcie
    rodzaj: kwota
    wartosci:
      - wartosc: 500.00
    alternatywy: [100.00, 1000.00]
  - id: limit.taryfa-oszczednosci.rachunek-saldo-prog
    rodzaj: kwota
    wartosci:
      - wartosc: 500000.00
      - od: 2027-01-01
        wartosc: 400000.00
    alternatywy: [250000.00]
  - id: limit.taryfa-oszczednosci.junior-wiek
    rodzaj: tekst
    wartosci:
      - wartosc: "do ukończenia 18 lat"
    alternatywy: ["do ukończenia 13 lat"]
  - id: limit.taryfa-oszczednosci.godzina-graniczna
    rodzaj: tekst
    wartosci:
      - wartosc: "15:00"
      - od: 2026-04-01
        wartosc: "14:00"
    alternatywy: ["16:00"]
  - id: limit.taryfa-oszczednosci.godzina-graniczna-waluty
    rodzaj: tekst
    wartosci:
      - wartosc: "13:00"
    alternatywy: ["12:00"]
