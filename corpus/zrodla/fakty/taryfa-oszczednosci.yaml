    rodzaj: kwota
    wartosci:
      - wartosc: 5.00
      - od: 2026-04-01
        wartosc: 6.00
    alternatywy: [3.00]
  - id: oplata.taryfa-oszczednosci.wyplata-waluta-prowizja
    rodzaj: procent
