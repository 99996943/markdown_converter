  - id: oplata.kredyt-firmowy.rozpatrzenie-wniosku
    rodzaj: kwota
    wartosci:
      - wartosc: 300.00
      - od: 2026-04-01
        wartosc: 350.00
    alternatywy: [0.00, 500.00]
  - id: oplata.kredyt-firmowy.aneks
    rodzaj: kwota
