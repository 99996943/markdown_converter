  - id: oplata.kredyt-firmowy.wizyta-monitoringowa
    rodzaj: kwota
    wartosci:
      - wartosc: 300.00
      - od: 2027-01-01
        wartosc: 350.00
    alternatywy: [200.00]
  - id: oplata.kredyt-firmowy.wczesna-splata
    rodzaj: procent
