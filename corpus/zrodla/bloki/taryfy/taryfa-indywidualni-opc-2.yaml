          - { usluga: "Zdalne odblokowanie karty w bankowości elektronicznej", stawka: "bez opłat", tryb: "za operację" }
  # ===== Usługi dodatkowe i dokumenty — pozycje dodatkowe =====
  - id: taryfa-indywidualni-opc-uslugi-1
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-uslugi
    elementy:
      - pozycje-taryfy:
          - { usluga: "Zaświadczenie o wysokości obrotów na rachunku za wskazany okres", stawka: "{{fakt:oplata.zaswiadczenie}}", tryb: "za każdy dokument" }
          - { usluga: "Zaświadczenie o historii spłaty zadłużenia w rachunku", stawka: "{{fakt:oplata.zaswiadczenie}}", tryb: "za każdy dokument" }
          - { usluga: "Zaświadczenie o otwartych w Banku rachunkach i produktach Klienta", stawka: "{{fakt:oplata.zaswiadczenie}}", tryb: "za każdy dokument" }
          - { usluga: "{Zaświadczenie|Informacja} do celów podatkowych o odsetkach zapłaconych i otrzymanych w roku podatkowym", stawka: "bez opłat", tryb: "za każdy dokument" }
          - { usluga: "Zaświadczenie dla celów wizowych w języku obcym", stawka: "{{fakt:oplata.taryfa-indywidualni.zaswiadczenie-obcojezyczne}}", tryb: "za każdy dokument" }
          - { usluga: "Zaświadczenie wydane w trybie ekspresowym (w ciągu jednego dnia roboczego)", stawka: "{{fakt:oplata.taryfa-indywidualni.opinia-bankowa}}", tryb: "za każdy dokument" }
          - { usluga: "Odpis zaświadczenia wydanego wcześniej przez Bank", stawka: "{{fakt:oplata.duplikat-umowy}}", tryb: "za każdy dokument" }
          - { usluga: "Wypełnienie przez Bank formularza przedłożonego przez Klienta", stawka: "{{fakt:oplata.taryfa-indywidualni.opinia-bankowa}}", tryb: "za każdy dokument" }
          - { usluga: "Potwierdzenie salda na dzień wskazany przez Klienta dla audytora", stawka: "{{fakt:oplata.taryfa-indywidualni.opinia-bankowa}}", tryb: "za każdy dokument" }
          - { usluga: "Poświadczenie podpisu Klienta w placówce na dokumencie bankowym", stawka: "bez opłat", tryb: "za każdy dokument" }
