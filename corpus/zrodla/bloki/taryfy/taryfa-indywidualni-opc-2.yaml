          - { usluga: "Wydruk historii rachunku w placówce (do 20 pozycji)", stawka: "bez opłat", tryb: "za wydruk" }
          - { usluga: "Wydruk historii rachunku w placówce (każde kolejne 20 pozycji)", stawka: "{{fakt:oplata.rachunek-osobisty.potwierdzenie-operacji}}", tryb: "za każdy wydruk" }
          - { usluga: "Wysyłka dokumentów kurierem na adres wskazany przez Klienta", stawka: "{{fakt:oplata.taryfa-indywidualni.wydanie-torby-kasowej}}", tryb: "za przesyłkę" }
          - { usluga: "Wysyłka dokumentów listem poleconym za potwierdzeniem odbioru", stawka: "{{fakt:oplata.wyciag-papierowy}}", tryb: "za przesyłkę" }
          - { usluga: "Przekazanie dokumentów drogą elektroniczną na adres e-mail wskazany w Banku", stawka: "bez opłat", tryb: "za przesyłkę" }
