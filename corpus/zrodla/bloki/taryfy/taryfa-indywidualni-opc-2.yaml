          - { usluga: "Wymiana zamka skrytki w razie utraty klucza", stawka: "250,00 zł", tryb: "jednorazowo" }
          - { usluga: "{Otwarcie|Komisyjne otwarcie} skrytki w razie nieobecności najemcy", stawka: "300,00 zł", tryb: "jednorazowo" }
          - { usluga: "Dodatkowe wejście do skrytki poza godzinami pracy placówki", stawka: "bez opłat", tryb: "za wejście" }
