          - { usluga: "Odpis dyspozycji lub zlecenia płatniczego z archiwum Banku", stawka: "{{fakt:oplata.taryfa-indywidualni.kopia-dokumentu-archiwum}}", tryb: "za każdy dokument" }
          - { usluga: "{Poszukiwanie|Wyszukanie} dokumentu w archiwum, za każdą rozpoczętą godzinę pracy pracownika", stawka: "{{fakt:oplata.taryfa-indywidualni.poszukiwanie-dokumentu}}", tryb: "za godzinę" }
          - { usluga: "Wniosek o udostępnienie dokumentów dla organu ścigania lub sądu", stawka: "bez opłat", tryb: "za wniosek" }
