          - { usluga: "Wymiana uszkodzonego tokena sprzętowego", stawka: "{{fakt:oplata.taryfa-indywidualni.token-sprzetowy}}", tryb: "jednorazowo" }
          - { usluga: "Autoryzacja dyspozycji kodem SMS", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Autoryzacja dyspozycji w aplikacji mobilnej Banku", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "{Powiązanie|Sparowanie} nowego urządzenia mobilnego z aplikacją", stawka: "bez opłat", tryb: "za urządzenie" }
          - { usluga: "Zablokowanie dostępu do bankowości elektronicznej na wniosek Klienta", stawka: "{{fakt:oplata.taryfa-indywidualni.blokada-na-wniosek}}", tryb: "za dyspozycję" }
          - { usluga: "Zablokowanie dostępu do bankowości elektronicznej zgłoszone telefonicznie z powodu utraty urządzenia", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Blokada środków na rachunku do wskazanej kwoty na wniosek Klienta (np. zabezpieczenie rozliczenia)", stawka: "{{fakt:oplata.taryfa-indywidualni.blokada-na-wniosek}}", tryb: "za dyspozycję" }
          - { usluga: "Zdjęcie blokady środków przed terminem na wniosek Klienta", stawka: "bez opłat", tryb: "za dyspozycję" }
