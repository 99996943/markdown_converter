bloki:
  # ===== Przelewy i zlecenia — pozycje dodatkowe =====
  - id: taryfa-indywidualni-opc-przelewy-1
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-przelewy
    elementy:
      - pozycje-taryfy:
          - { usluga: "Przelew krajowy w złotych zlecony z datą przyszłą w bankowości elektronicznej", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew krajowy w złotych zlecony z datą przyszłą w placówce", stawka: "{{fakt:oplata.przelew-zewnetrzny-placowka}}", tryb: "za operację" }
          - { usluga: "{Przelew|Zlecenie przelewu} na rachunek telefoniczny odbiorcy (na numer telefonu)", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew na rachunek odbiorcy prowadzony w tym samym banku, zlecony w placówce", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew zlecony w placówce na kwotę wyższą niż {{fakt:limit.rachunek-osobisty.przelew-placowka}}", stawka: "nie jest realizowany", tryb: "za operację" }
          - { usluga: "Przelew podatkowy do urzędu skarbowego z użyciem formularza elektronicznego", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew do organu celnego lub izby administracji skarbowej", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew do rachunku w ramach split payment (mechanizm podzielonej płatności)", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew na rachunek lokaty terminowej prowadzonej w Banku", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew zbiorczy (do 10 odbiorców) w bankowości elektronicznej", stawka: "bez opłat", tryb: "za operację" }
  - id: taryfa-indywidualni-opc-przelewy-2
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-przelewy
    elementy:
      - pozycje-taryfy:
          - { usluga: "Założenie zlecenia stałego z częstotliwością miesięczną", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "{Modyfikacja|Zmiana} kwoty lub terminu zlecenia stałego w bankowości elektronicznej", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zmiana lub odwołanie zlecenia stałego w placówce", stawka: "{{fakt:oplata.taryfa-indywidualni.zlecenie-stale-placowka}}", tryb: "za dyspozycję" }
          - { usluga: "Wykonanie zlecenia stałego do rachunku w innym banku", stawka: "{{fakt:oplata.rachunek-osobisty.zlecenie-stale}}", tryb: "za każde wykonanie" }
          - { usluga: "Wykonanie zlecenia stałego do rachunku w Banku", stawka: "bez opłat", tryb: "za każde wykonanie" }
          - { usluga: "Niewykonanie zlecenia stałego z powodu braku środków na rachunku", stawka: "bez opłat", tryb: "za każde zlecenie" }
          - { usluga: "Ponowna próba wykonania zlecenia stałego następnego dnia roboczego", stawka: "bez opłat", tryb: "za każdą próbę" }
          - { usluga: "Zawieszenie zlecenia stałego na wniosek Klienta", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zlecenie stałe na rachunek oszczędnościowy (automatyczne odkładanie)", stawka: "bez opłat", tryb: "za każde wykonanie" }
          - { usluga: "Zmiana terminu wykonywania zlecenia stałego na przedostatni dzień miesiąca", stawka: "bez opłat", tryb: "za dyspozycję" }
  - id: taryfa-indywidualni-opc-przelewy-3
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-przelewy
    elementy:
      - pozycje-taryfy:
          - { usluga: "Udzielenie zgody na polecenie zapłaty w placówce", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Polecenie zapłaty — realizacja obciążenia rachunku Klienta", stawka: "{{fakt:oplata.rachunek-osobisty.polecenie-zaplaty}}", tryb: "za każde obciążenie" }
          - { usluga: "Odwołanie zgody na polecenie zapłaty", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "{Ustalenie|Ustawienie} limitu kwotowego dla polecenia zapłaty", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Blokada polecenia zapłaty w odniesieniu do wskazanego odbiorcy", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zwrot kwoty autoryzowanego polecenia zapłaty w terminie 8 tygodni od obciążenia", stawka: "bez opłat", tryb: "za wniosek" }
          - { usluga: "Zgłoszenie nieautoryzowanego obciążenia rachunku w placówce", stawka: "bez opłat", tryb: "za wniosek" }
          - { usluga: "Zgłoszenie nieautoryzowanego obciążenia rachunku przez infolinię", stawka: "bez opłat", tryb: "za wniosek" }
          - { usluga: "Zwrot kwoty nieautoryzowanej transakcji płatniczej[^1]", stawka: "bez opłat", tryb: "za wniosek" }
          - { usluga: "Wniosek o ustalenie losów przelewu, który nie dotarł do odbiorcy", stawka: "{{fakt:oplata.taryfa-indywidualni.odwolanie-przelewu}}", tryb: "za wniosek" }
    przypisy:
      1: "Zwrot następuje {{fakt:termin.rachunek-osobisty.zwrot-nieautoryzowanej}}, o ile zgłoszenie nastąpiło w terminie {{fakt:termin.rachunek-osobisty.zgloszenie-nieautoryzowanej}} od dnia obciążenia rachunku."
  - id: taryfa-indywidualni-opc-przelewy-4
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-przelewy
    elementy:
      - pozycje-taryfy:
          - { usluga: "Przelew w euro do rachunku w państwie spoza Europejskiego Obszaru Gospodarczego", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty przelewu, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, max. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty przelewu" }
          - { usluga: "Przelew w dolarach amerykańskich do rachunku w banku zagranicznym", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty przelewu, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, max. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty przelewu" }
          - { usluga: "Przelew w funtach szterlingach do rachunku w banku zagranicznym", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty przelewu, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, max. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty przelewu" }
          - { usluga: "Przelew w złotych do rachunku prowadzonego przez bank zagraniczny", stawka: "{{fakt:oplata.rachunek-osobisty.przelew-walutowy}}", tryb: "za operację" }
          - { usluga: "{Pilny|Przyspieszony} przelew zagraniczny rozliczany w tym samym dniu roboczym", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sorbnet}} (dodatkowo)", tryb: "za operację" }
          - { usluga: "Opcja kosztów SHA (koszty dzielone między zleceniodawcę i odbiorcę)", stawka: "bez opłat dodatkowych", tryb: "za operację" }
          - { usluga: "Opcja kosztów BEN (koszty ponosi odbiorca)", stawka: "bez opłat dodatkowych", tryb: "za operację" }
          - { usluga: "Przelew walutowy między własnymi rachunkami w Banku, w różnych walutach", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przeliczenie waluty w przelewie między własnymi rachunkami", stawka: "kurs z Tabeli kursów walut Banku", tryb: "w dniu operacji" }
          - { usluga: "Zlecenie wymiany walut w bankowości elektronicznej po kursie z Tabeli", stawka: "bez opłat", tryb: "za operację" }
  - id: taryfa-indywidualni-opc-przelewy-5
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-przelewy
    elementy:
      - pozycje-taryfy:
          - { usluga: "Przelew zagraniczny przychodzący w euro (SEPA) z Europejskiego Obszaru Gospodarczego", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Przelew zagraniczny przychodzący z państwa spoza Europejskiego Obszaru Gospodarczego", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-walutowy-przychodzacy}}", tryb: "za operację" }
          - { usluga: "Rozliczenie czeku zagranicznego w złotych", stawka: "0,5% kwoty czeku, min. 25,00 zł", tryb: "od kwoty czeku" }
          - { usluga: "Poszukiwanie przelewu zagranicznego, który nie został uznany na rachunku", stawka: "{{fakt:oplata.taryfa-indywidualni.odwolanie-przelewu}}", tryb: "za wniosek" }
          - { usluga: "Korekta danych w przelewie zagranicznym przychodzącym", stawka: "{{fakt:oplata.taryfa-indywidualni.odwolanie-przelewu}}", tryb: "za dyspozycję" }
          - { usluga: "{Zwrot|Odesłanie} przelewu zagranicznego przychodzącego na wniosek odbiorcy", stawka: "{{fakt:oplata.taryfa-indywidualni.zwrot-przelewu}}", tryb: "za operację" }
          - { usluga: "Potwierdzenie przelewu zagranicznego w formie dokumentu SWIFT", stawka: "{{fakt:oplata.rachunek-osobisty.potwierdzenie-operacji}}", tryb: "za każdy dokument" }
          - { usluga: "Potwierdzenie przelewu zagranicznego w języku angielskim", stawka: "{{fakt:oplata.rachunek-osobisty.potwierdzenie-operacji}}", tryb: "za każdy dokument" }
          - { usluga: "Zawiadomienie o uznaniu rachunku w złotych kwotą w walucie obcej", stawka: "bez opłat", tryb: "za każdy dokument" }
          - { usluga: "Informacja o kursie zastosowanym w przeliczeniu przelewu", stawka: "bez opłat", tryb: "za każdy dokument" }
  # ===== Operacje gotówkowe — pozycje dodatkowe =====
  - id: taryfa-indywidualni-opc-gotowka-1
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-gotowka
    elementy:
      - pozycje-taryfy:
          - { usluga: "Wpłata gotówki w złotych we wpłatomacie z użyciem karty debetowej", stawka: "{{fakt:oplata.taryfa-indywidualni.wplata-wplatomat}}", tryb: "za operację" }
          - { usluga: "Wpłata gotówki w złotych we wpłatomacie bez użycia karty, z kodem jednorazowym płatności mobilnych", stawka: "{{fakt:oplata.taryfa-indywidualni.wplata-wplatomat}}", tryb: "za operację" }
          - { usluga: "Wpłata monet w złotych w placówce (powyżej 50 sztuk)", stawka: "{{fakt:oplata.taryfa-indywidualni.rozmiana-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.rozmiana-minimum}}", tryb: "od kwoty operacji" }
          - { usluga: "Wpłata monet w złotych w placówce (do 50 sztuk)", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Wpłata gotówki w walucie obcej na rachunek walutowy w placówce", stawka: "{{fakt:oplata.wplata-gotowkowa}}", tryb: "za operację" }
          - { usluga: "{Wpłata|Przyjęcie wpłaty} gotówki na rachunek z jednoczesnym przewalutowaniem", stawka: "{{fakt:oplata.wplata-gotowkowa}}", tryb: "za operację" }
          - { usluga: "Wpłata zamknięta (wpłata w zalakowanej kopercie z późniejszym przeliczeniem)", stawka: "{{fakt:oplata.taryfa-indywidualni.wydanie-torby-kasowej}}", tryb: "za operację" }
          - { usluga: "Przeliczenie wpłaty zamkniętej w obecności Klienta na jego żądanie", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Sprawdzenie autentyczności banknotu na wniosek Klienta", stawka: "bez opłat", tryb: "za sztukę" }
          - { usluga: "Wymiana uszkodzonego banknotu w złotych na wniosek Klienta", stawka: "bez opłat", tryb: "za sztukę" }
  - id: taryfa-indywidualni-opc-gotowka-2
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-gotowka
    elementy:
      - pozycje-taryfy:
          - { usluga: "Awizacja wypłaty gotówki powyżej {{fakt:limit.rachunek-osobisty.wyplata-awizo}} składana w placówce", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Awizacja wypłaty gotówki składana w bankowości elektronicznej", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zmiana terminu awizowanej wypłaty gotówki", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Odwołanie awizacji nie później niż w dniu poprzedzającym wypłatę", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Odwołanie awizacji w dniu wypłaty", stawka: "{{fakt:oplata.taryfa-indywidualni.awizo-niepodjeta}}", tryb: "za dyspozycję" }
          - { usluga: "Wypłata gotówki w walucie obcej w nominałach banknotów", stawka: "{{fakt:oplata.taryfa-indywidualni.wyplata-gotowki-walutowej}} kwoty wypłaty", tryb: "od kwoty wypłaty" }
          - { usluga: "Wypłata gotówki z rachunku w przypadku zlecenia osoby upoważnionej", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "{Wypłata|Realizacja wypłaty} gotówki na podstawie dyspozycji na wypadek śmierci", stawka: "{{fakt:oplata.rachunek-osobisty.dyspozycja-smierci}}", tryb: "za operację" }
          - { usluga: "Wypłata gotówki w kasie placówki z użyciem dokumentu tożsamości zamiast karty", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Wypłata całości środków przy zamknięciu rachunku", stawka: "{{fakt:oplata.rachunek-osobisty.zamkniecie}}", tryb: "jednorazowo" }
  - id: taryfa-indywidualni-opc-gotowka-3
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-gotowka
    elementy:
      - pozycje-taryfy:
          - { usluga: "Wypłata gotówki z bankomatu Banku w ramach usługi cashback w punkcie handlowym", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Wypłata gotówki z bankomatu Banku przy użyciu kodu jednorazowego płatności mobilnych", stawka: "bez opłat", tryb: "za operację" }
          - { usluga: "Wypłata gotówki z bankomatu obcego w kraju przy użyciu kodu jednorazowego płatności mobilnych", stawka: "{{fakt:oplata.bankomat-obcy}}", tryb: "za operację" }
          - { usluga: "Wypłata gotówki z bankomatu za granicą w walucie obcej, z przeliczeniem według kursu Banku", stawka: "{{fakt:oplata.karta-debetowa.wyplata-bankomat-zagranica}}", tryb: "za operację" }
          - { usluga: "Dzienny limit wypłat gotówki z bankomatów (ustawienie domyślne)", stawka: "{{fakt:limit.karta.dzienny-gotowkowy}}", tryb: "dziennie" }
          - { usluga: "Najwyższy limit wypłat gotówki możliwy do ustawienia", stawka: "{{fakt:limit.karta-debetowa.maksymalny-ustawiany-gotowkowy}}", tryb: "dziennie" }
          - { usluga: "Najniższy limit wypłat gotówki możliwy do ustawienia", stawka: "{{fakt:limit.karta-debetowa.minimalny-ustawiany}}", tryb: "dziennie" }
          - { usluga: "Maksymalna wpłata gotówki we wpłatomacie", stawka: "{{fakt:limit.karta-debetowa.maksymalna-wplata-wplatomat}}", tryb: "za operację" }
          - { usluga: "Wypłata gotówki z bankomatu na terytorium Unii Europejskiej w walucie euro", stawka: "{{fakt:oplata.karta-debetowa.wyplata-bankomat-zagranica}}", tryb: "za operację" }
          - { usluga: "Zgłoszenie połknięcia karty przez bankomat i jej odzyskanie w placówce", stawka: "bez opłat", tryb: "za dyspozycję" }
  # ===== Karty debetowe — pozycje dodatkowe =====
  - id: taryfa-indywidualni-opc-karty-1
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-karty
    elementy:
      - pozycje-taryfy:
          - { usluga: "Aktywacja karty w bankowości elektronicznej lub w bankomacie Banku", stawka: "bez opłat", tryb: "jednorazowo" }
          - { usluga: "Ponowne wysłanie PIN w postaci wiadomości SMS", stawka: "{{fakt:oplata.karta-debetowa.zmiana-pin}}", tryb: "za dyspozycję" }
          - { usluga: "Ponowne wysłanie karty na inny adres korespondencyjny", stawka: "{{fakt:oplata.karta.wydanie-duplikatu}}", tryb: "jednorazowo" }
          - { usluga: "Wydanie karty z indywidualnym projektem graficznym", stawka: "{{fakt:oplata.taryfa-indywidualni.karta-dodatkowa}}", tryb: "jednorazowo" }
          - { usluga: "{Wznowienie|Odnowienie} karty z nowym numerem po zastrzeżeniu", stawka: "{{fakt:oplata.karta.wydanie-duplikatu}}", tryb: "jednorazowo" }
          - { usluga: "Rezygnacja z wznowienia karty złożona w terminie {{fakt:termin.karta-debetowa.rezygnacja-z-wznowienia}} przed upływem ważności", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zamknięcie karty na wniosek Klienta", stawka: "bez opłat", tryb: "jednorazowo" }
          - { usluga: "Okres ważności karty debetowej", stawka: "{{fakt:karta-debetowa.okres-waznosci}}", tryb: "jednorazowo" }
          - { usluga: "Wydanie karty debetowej dla osoby niepełnoletniej, która ukończyła {{fakt:wiek.rachunek-osobisty.ograniczona-zdolnosc}}", stawka: "{{fakt:oplata.karta-debetowa.wydanie}}", tryb: "jednorazowo" }
          - { usluga: "Wydanie karty do rachunku wspólnego dla drugiego współposiadacza", stawka: "{{fakt:oplata.taryfa-indywidualni.karta-dodatkowa}}", tryb: "jednorazowo" }
  - id: taryfa-indywidualni-opc-karty-2
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: pozycje-ind-karty
    elementy:
      - pozycje-taryfy:
          - { usluga: "Płatność kartą w sklepie internetowym wymagającym uwierzytelnienia silnego", stawka: "bez opłat", tryb: "za transakcję" }
          - { usluga: "Płatność kartą w serwisie zagranicznym (w złotych, po przeliczeniu)", stawka: "{{fakt:oplata.taryfa-indywidualni.karta-transakcja-walutowa-prowizja}} kwoty transakcji", tryb: "od kwoty transakcji" }
          - { usluga: "Płatność kartą za granicą w walucie obcej (rozliczenie według kursu z Tabeli)", stawka: "{{fakt:oplata.taryfa-indywidualni.karta-transakcja-walutowa-prowizja}} kwoty transakcji", tryb: "od kwoty transakcji" }
          - { usluga: "Zwrot transakcji kartowej w walucie obcej (rozliczenie po kursie z dnia zwrotu)", stawka: "bez opłat", tryb: "za transakcję" }
          - { usluga: "Zbliżeniowa płatność kartą bez PIN do kwoty {{fakt:limit.karta-debetowa.zblizeniowy-bez-pin}}", stawka: "bez opłat", tryb: "za transakcję" }
          - { usluga: "Skumulowany limit transakcji zbliżeniowych bez PIN", stawka: "{{fakt:limit.karta-debetowa.zblizeniowy-skumulowany}}", tryb: "do kolejnego PIN" }
          - { usluga: "{Zablokowanie|Wyłączenie} płatności zbliżeniowych na wniosek Klienta", stawka: "bez opłat", tryb: "za dyspozycję" }
