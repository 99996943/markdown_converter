          - { usluga: "Powiadomienie płatników i odbiorców o zmianie numeru rachunku", stawka: "bez opłat", tryb: "jednorazowo" }
          - { usluga: "Przeniesienie zleceń stałych i poleceń zapłaty z poprzedniego rachunku", stawka: "bez opłat", tryb: "za zlecenie" }
          - { usluga: "{Zamknięcie|Likwidacja} rachunku w innym banku w ramach usługi zmiany rachunku", stawka: "bez opłat", tryb: "jednorazowo" }
          - { usluga: "Wypłata spadku z rachunku zmarłego posiadacza na podstawie postanowienia sądu lub aktu poświadczenia dziedziczenia", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Sporządzenie zestawienia obrotów na rachunku zmarłego posiadacza", stawka: "{{fakt:oplata.zaswiadczenie}}", tryb: "za każdy dokument" }
          - { usluga: "Realizacja zajęcia egzekucyjnego — zawiadomienie Klienta i organu egzekucyjnego", stawka: "{{fakt:oplata.rachunek-osobisty.zajecie-egzekucyjne}}", tryb: "za każde zajęcie" }
          - { usluga: "Uwolnienie środków po cofnięciu zajęcia", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Rozpatrzenie reklamacji dotyczącej opłat i prowizji", stawka: "bez opłat", tryb: "za reklamację" }
          - { usluga: "Rozpatrzenie wniosku o ugodę lub restrukturyzację zadłużenia", stawka: "bez opłat", tryb: "za wniosek" }
  # ===== Objaśnienia — pozycje opcjonalne =====
  - id: taryfa-indywidualni-opc-objasnienie-1
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: objasnienie-ind
    elementy:
      - ustep: "Stawki dotyczące kart debetowych {mają zastosowanie|obowiązują} także do kart wydanych przed dniem wejścia w życie Taryfy, od pierwszego dnia miesiąca następującego po dniu, w którym upłynął termin wypowiedzenia zmiany."
      - ustep: "Klient, który nie zgadza się na zmianę stawek, może przed dniem ich wejścia w życie wypowiedzieć umowę rachunku bez ponoszenia opłat z tytułu wypowiedzenia, zachowując termin {{fakt:termin.wypowiedzenie-przez-klienta}} od dnia doręczenia wypowiedzenia."
  - id: taryfa-indywidualni-opc-objasnienie-2
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: objasnienie-ind
    elementy:
      - ustep: "Pojęcie „placówka” oznacza oddział lub agencję Banku prowadzącą obsługę klientów indywidualnych; wykaz placówek wraz z godzinami otwarcia jest dostępny na stronie {{fakt:bank.strona}}."
      - ustep: "Pojęcie „bankomat obcy” oznacza bankomat niebędący własnością Banku ani niewchodzący w skład sieci bankomatów, w których wypłaty są bezpłatne, o czym Klient jest informowany na ekranie urządzenia przed potwierdzeniem operacji."
  - id: taryfa-indywidualni-opc-objasnienie-3
    typy: [taryfy]
    tematy: [taryfa-indywidualni]
    kategoria: objasnienie-ind
    elementy:
      - ustep: "Opłaty z tytułu wykonywania czynności, które nie zostały wymienione w Taryfie, Bank ustala na podstawie rzeczywistych kosztów poniesionych w związku z ich wykonaniem, informując Klienta o ich wysokości przed wykonaniem czynności."
      - ustep: "W razie wątpliwości co do tego, która pozycja Taryfy ma zastosowanie do danej czynności, {stosuje się|przyjmuje się} stawkę korzystniejszą dla Klienta."
