          - { usluga: "Wydanie depozytu na żądanie osoby upoważnionej", stawka: "bez opłat", tryb: "za dyspozycję" }
          - { usluga: "Zmiana osoby upoważnionej do dostępu do skrytki", stawka: "{{fakt:oplata.rachunek-osobisty.pelnomocnictwo}}", tryb: "jednorazowo" }
          - { usluga: "Zwrot skrytki przed końcem okresu najmu (zwrot opłaty proporcjonalnie)", stawka: "bez opłat", tryb: "jednorazowo" }
  - id: taryfa-indywidualni-opc-uslugi-4
    typy: [taryfy]
