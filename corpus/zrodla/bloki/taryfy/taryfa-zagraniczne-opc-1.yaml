bloki:
  # ---------------------------------------------------------------- II. Klienci indywidualni
  - id: taryfa-zagraniczne-opc-ind-1
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-ind
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew w dolarach amerykańskich do banku poza SEPA (opcja SHA)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w funtach szterlingach do banku w Wielkiej Brytanii", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew we frankach szwajcarskich do banku w Szwajcarii", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w koronach czeskich, szwedzkich lub norweskich do banku w Europie", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w euro do banku w kraju spoza obszaru SEPA", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew zagraniczny złożony za pośrednictwem {infolinii|konsultanta telefonicznego}[^1]", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-infolinia}} (dodatkowo)", tryb: "za operację"}
          - {usluga: "Przelew zagraniczny w opcji kosztów BEN", stawka: "bez dopłaty", tryb: "za operację"}
          - {usluga: "Przelew wychodzący w złotych na rachunek w banku za granicą", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew zagraniczny z rachunku walutowego do banku w kraju zamieszkania Klienta (przekaz środków własnych)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew do państwa objętego ograniczeniami (wymaga {dodatkowej weryfikacji|ręcznej weryfikacji} dyspozycji)", stawka: "wg wyceny indywidualnej", tryb: "za operację"}
    przypisy:
      1: "Dyspozycja złożona telefonicznie wymaga uwierzytelnienia Klienta i jest realizowana wyłącznie w kwocie do limitu dziennego określonego w umowie."

  - id: taryfa-zagraniczne-opc-ind-2
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-ind
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew zagraniczny — zlecenie stałe w walucie obcej, jedna realizacja", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-procent}} kwoty, min. {{fakt:oplata.taryfa-indywidualni.przelew-zagraniczny-minimum}}", tryb: "za operację"}
          - {usluga: "Przelew zagraniczny z datą przyszłą (zlecenie zaplanowane)", stawka: "bez dopłaty", tryb: "za operację"}
          - {usluga: "Anulowanie zlecenia przelewu zagranicznego z datą przyszłą przed dniem realizacji", stawka: "bez opłat", tryb: "za dyspozycję"}
          - {usluga: "Odwołanie przelewu zagranicznego po przekazaniu do realizacji (próba)", stawka: "{{fakt:oplata.zagraniczne.zmiana-dyspozycji-ind}}", tryb: "za dyspozycję"}
          - {usluga: "Odwołanie przelewu krajowego w walucie obcej do rachunku w Banku", stawka: "{{fakt:oplata.taryfa-indywidualni.odwolanie-przelewu}}", tryb: "za dyspozycję"}
          - {usluga: "Zwrot przelewu zagranicznego, który został odrzucony przez bank odbiorcy", stawka: "bez opłat", tryb: "za operację"}
          - {usluga: "Zwrot przelewu zagranicznego z opłatą przekazaną przez bank pośredniczący", stawka: "wg rzeczywistych kosztów banku pośredniczącego", tryb: "za operację"}
          - {usluga: "Przelew dewizowy związany z zakupem nieruchomości za granicą — obsługa dokumentów", stawka: "{{fakt:oplata.zagraniczne.weryfikacja-dokumentow}}", tryb: "za zlecenie"}
          - {usluga: "Dołączenie faktury lub umowy do dyspozycji przelewu zagranicznego", stawka: "{{fakt:oplata.zagraniczne.dolaczenie-kopii-dokumentow}}", tryb: "za każdy dokument"}
          - {usluga: "Potwierdzenie przelewu zagranicznego w języku angielskim", stawka: "{{fakt:oplata.zagraniczne.potwierdzenie-realizacji}}", tryb: "za dokument"}

  - id: taryfa-zagraniczne-opc-ind-3
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-ind
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew między własnymi rachunkami walutowymi w tej samej walucie", stawka: "bez opłat", tryb: "za operację"}
          - {usluga: "Przelew między własnymi rachunkami w różnych walutach (z przeliczeniem po kursie kantorowym)", stawka: "kurs z marżą {{fakt:oplata.zagraniczne.wymiana-marza-kantor}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew walutowy do innego klienta Banku w bankowości internetowej", stawka: "{{fakt:oplata.zagraniczne.przelew-wewnetrzny-walutowy}}", tryb: "za operację"}
          - {usluga: "Przelew walutowy do innego klienta Banku w placówce", stawka: "{{fakt:oplata.zagraniczne.przelew-wewnetrzny-walutowy-placowka}}", tryb: "za operację"}
          - {usluga: "Przelew na rachunek walutowy dziecka (rachunek dla małoletniego)", stawka: "bez opłat", tryb: "za operację"}
          - {usluga: "Prowadzenie rachunku walutowego dla małoletniego", stawka: "bez opłat", tryb: "miesięcznie"}
          - {usluga: "{Karta|Karta debetowa} wielowalutowa — dodatkowa opłata za obsługę waluty obcej", stawka: "{{fakt:oplata.taryfa-indywidualni.karta-transakcja-walutowa-prowizja}} kwoty transakcji", tryb: "od kwoty transakcji"}
          - {usluga: "Zamknięcie rachunku walutowego z wypłatą salda w gotówce", stawka: "{{fakt:oplata.zagraniczne.rachunek-walutowy-zamkniecie}} + prowizja za wypłatę gotówki", tryb: "jednorazowo"}
          - {usluga: "Zaświadczenie o źródle pochodzenia środków z przelewu przychodzącego", stawka: "{{fakt:oplata.zaswiadczenie}}", tryb: "za dokument"}
          - {usluga: "Wyciąg z rachunku walutowego w formie papierowej", stawka: "{{fakt:oplata.zagraniczne.wyciag-walutowy-papierowy}}", tryb: "za każdy wyciąg"}

  # ---------------------------------------------------------------- III. Przedsiębiorcy
  - id: taryfa-zagraniczne-opc-firmy-1
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-firmy
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew w dolarach amerykańskich do banku poza SEPA (opcja SHA)", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.firma.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w funtach szterlingach do banku w Wielkiej Brytanii", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.firma.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew we frankach szwajcarskich do banku w Szwajcarii", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.firma.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w juanach, jenach lub dolarach kanadyjskich do banku poza Europą", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.firma.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew w złotych na rachunek w banku za granicą (opcja SHA)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Przelew w euro do kraju poza obszarem SEPA (np. Turcja, Ukraina)", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}, maks. {{fakt:oplata.firma.przelew-zagraniczny-maksimum}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew do państwa wymagającego dodatkowych dokumentów celnych[^1]", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}} + {{fakt:oplata.zagraniczne.weryfikacja-dokumentow}}", tryb: "od kwoty transakcji"}
          - {usluga: "Przelew zagraniczny składany w {paczce|pliku importowanym} z systemu finansowo-księgowego", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-prowizja}} kwoty, min. {{fakt:oplata.firma.przelew-zagraniczny-minimum}}", tryb: "za przelew w paczce"}
          - {usluga: "Przelew zagraniczny złożony za pośrednictwem opiekuna klienta", stawka: "{{fakt:oplata.firma.przelew-placowka}} (dodatkowo)", tryb: "za przelew"}
          - {usluga: "Przelew do spółki powiązanej kapitałowo w ramach rozliczeń grupy", stawka: "wg umowy", tryb: "za przelew"}
    przypisy:
      1: "Opłata za weryfikację dokumentów jest pobierana jednorazowo, jeżeli do przelewu załączono więcej niż jeden dokument dotyczący tej samej transakcji."

  - id: taryfa-zagraniczne-opc-firmy-2
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-firmy
    elementy:
      - pozycje-taryfy:
          - {usluga: "Dopłata za realizację przelewu zagranicznego w trybie pilnym (D+1)", stawka: "{{fakt:oplata.firma.przelew-zagraniczny-pilny}}", tryb: "za przelew"}
          - {usluga: "Dopłata za realizację przelewu zagranicznego w trybie ekspresowym (D+0)", stawka: "{{fakt:oplata.zagraniczne.swift-ekspres}}", tryb: "za przelew"}
          - {usluga: "Dopłata za opcję kosztów OUR", stawka: "{{fakt:oplata.zagraniczne.opcja-our-firma}}", tryb: "za przelew"}
          - {usluga: "Dopłata za dodatkowy kontakt z bankiem odbiorcy w celu potwierdzenia warunków przelewu OUR", stawka: "{{fakt:oplata.zagraniczne.potwierdzenie-realizacji}}", tryb: "za przelew"}
          - {usluga: "Zmiana dyspozycji przelewu zagranicznego po przekazaniu do realizacji", stawka: "{{fakt:oplata.firma.zmiana-dyspozycji-zagranicznej}}", tryb: "za dyspozycję"}
          - {usluga: "Odwołanie przelewu zagranicznego po przekazaniu do realizacji", stawka: "{{fakt:oplata.firma.odwolanie-przelewu}}", tryb: "za dyspozycję"}
          - {usluga: "Zwrot przelewu zagranicznego na wniosek zleceniodawcy", stawka: "{{fakt:oplata.zagraniczne.zwrot-przelewu-zagranicznego}}", tryb: "za operację"}
          - {usluga: "Naprawa instrukcji płatniczej przed wysłaniem przelewu", stawka: "{{fakt:oplata.zagraniczne.naprawa-instrukcji}}", tryb: "za przelew"}
          - {usluga: "Poszukiwanie przelewu zagranicznego", stawka: "{{fakt:oplata.firma.poszukiwanie-przelewu}}", tryb: "za zlecenie"}
          - {usluga: "Kopia komunikatu SWIFT dotyczącego przelewu", stawka: "{{fakt:oplata.zagraniczne.kopia-mt103}}", tryb: "za dokument"}

  - id: taryfa-zagraniczne-opc-firmy-3
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-firmy
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew walutowy między rachunkami Klienta w Banku", stawka: "{{fakt:oplata.zagraniczne.przelew-wewnetrzny-walutowy}}", tryb: "za przelew"}
          - {usluga: "Przelew walutowy do innego klienta Banku w bankowości internetowej", stawka: "{{fakt:oplata.zagraniczne.przelew-wewnetrzny-walutowy}}", tryb: "za przelew"}
          - {usluga: "Przelew walutowy do innego klienta Banku zlecony w placówce", stawka: "{{fakt:oplata.zagraniczne.przelew-wewnetrzny-walutowy-placowka}}", tryb: "za przelew"}
          - {usluga: "Wymiana walut na rachunkach firmowych w kantorze internetowym", stawka: "kurs z marżą {{fakt:oplata.zagraniczne.wymiana-marza-kantor}}", tryb: "od kwoty transakcji"}
          - {usluga: "Wymiana walut na rachunkach firmowych według Tabeli kursów walut", stawka: "kurs z marżą {{fakt:kurs.marza-przeliczen}}", tryb: "od kwoty transakcji"}
          - {usluga: "Obsługa rachunku walutowego z dostępem {przez bankowość|w ramach bankowości} dla firm", stawka: "{{fakt:oplata.firma.rachunek-walutowy-prowadzenie}}", tryb: "miesięcznie"}
          - {usluga: "Opinia bankowa dla kontrahenta zagranicznego (w języku angielskim)", stawka: "{{fakt:oplata.firma.opinia-bankowa}}", tryb: "za dokument"}
          - {usluga: "Potwierdzenie salda rachunku walutowego dla biegłego rewidenta", stawka: "{{fakt:oplata.firma.potwierdzenie-salda-audyt}}", tryb: "za dokument"}
          - {usluga: "Przygotowanie zestawienia przelewów zagranicznych za wskazany okres (format elektroniczny)", stawka: "{{fakt:oplata.firma.wyciag-mt940}}", tryb: "za zestawienie"}
          - {usluga: "Przekazanie informacji o transakcjach dewizowych do raportowania statystycznego (na wniosek)", stawka: "{{fakt:oplata.zagraniczne.weryfikacja-dokumentow}}", tryb: "za zlecenie"}

  # ---------------------------------------------------------------- IV. Przelewy SEPA
  - id: taryfa-zagraniczne-opc-sepa-1
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-sepa
    elementy:
      - pozycje-taryfy:
          - {usluga: "Przelew SEPA do Niemiec, Francji lub Włoch (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew SEPA do państwa Unii Europejskiej spoza strefy euro (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew SEPA do Islandii, Liechtensteinu lub Norwegii (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew SEPA do Szwajcarii (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew SEPA do Niemiec, Francji lub Włoch (przedsiębiorca)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Przelew SEPA do państwa Unii Europejskiej spoza strefy euro (przedsiębiorca)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Przelew SEPA do Islandii, Liechtensteinu lub Norwegii (przedsiębiorca)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Przelew SEPA do Szwajcarii lub Monako (przedsiębiorca)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Przelew SEPA Instant do banku uczestniczącego w schemacie (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Przelew SEPA Instant w {godzinach nocnych|porze nocnej} i w dni wolne od pracy", stawka: "bez dopłaty", tryb: "za operację"}

  - id: taryfa-zagraniczne-opc-sepa-2
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-sepa
    elementy:
      - pozycje-taryfy:
          - {usluga: "Zlecenie stałe SEPA — ustanowienie lub zmiana w bankowości internetowej", stawka: "bez opłat", tryb: "za dyspozycję"}
          - {usluga: "Zlecenie stałe SEPA — ustanowienie lub zmiana w placówce", stawka: "{{fakt:oplata.taryfa-indywidualni.zlecenie-stale-placowka}}", tryb: "za dyspozycję"}
          - {usluga: "Zlecenie stałe SEPA — realizacja jednego przelewu (klient indywidualny)", stawka: "{{fakt:oplata.taryfa-indywidualni.przelew-sepa}}", tryb: "za operację"}
          - {usluga: "Zlecenie stałe SEPA — realizacja jednego przelewu (przedsiębiorca)", stawka: "{{fakt:oplata.firma.przelew-sepa}}", tryb: "za przelew"}
          - {usluga: "Polecenie zapłaty SEPA — przyjęcie zgody (mandatu) na obciążenie rachunku", stawka: "bez opłat", tryb: "za mandat"}
          - {usluga: "Polecenie zapłaty SEPA — realizacja obciążenia rachunku płatnika", stawka: "{{fakt:oplata.firma.polecenie-zaplaty}}", tryb: "za operację"}
          - {usluga: "Polecenie zapłaty SEPA — zwrot autoryzowanego obciążenia na wniosek płatnika", stawka: "{{fakt:oplata.zagraniczne.sepa-zwrot-przychodzacego}}", tryb: "za operację"}
          - {usluga: "Odwołanie mandatu polecenia zapłaty SEPA", stawka: "bez opłat", tryb: "za dyspozycję"}
          - {usluga: "Blokada rachunku dla poleceń zapłaty SEPA", stawka: "bez opłat", tryb: "za dyspozycję"}
          - {usluga: "Lista dozwolonych wierzycieli poleceń zapłaty SEPA — wprowadzenie wpisu", stawka: "bez opłat", tryb: "za dyspozycję"}

  - id: taryfa-zagraniczne-opc-sepa-3
    typy: [taryfy]
    tematy: [taryfa-zagraniczne]
    kategoria: pozycje-zagraniczne-sepa
    elementy:
      - pozycje-taryfy:
          - {usluga: "Anulowanie przelewu SEPA zleconego z datą przyszłą", stawka: "bez opłat", tryb: "za dyspozycję"}
          - {usluga: "Prośba o zwrot przelewu SEPA wysłanego omyłkowo (recall)[^1]", stawka: "{{fakt:oplata.zagraniczne.zwrot-przelewu-zagranicznego}}", tryb: "za wniosek"}
          - {usluga: "Prośba o zwrot przelewu SEPA wysłanego na podstawie fałszywego zlecenia (oszustwo)", stawka: "bez opłat", tryb: "za wniosek"}
          - {usluga: "Zwrot przelewu SEPA otrzymanego z błędem numeru IBAN", stawka: "{{fakt:oplata.zagraniczne.sepa-zwrot-przychodzacego}}", tryb: "za operację"}
          - {usluga: "Zapytanie o status przelewu SEPA starszego niż 3 dni robocze", stawka: "bez opłat", tryb: "za zapytanie"}
          - {usluga: "Poszukiwanie przelewu SEPA nieotrzymanego przez odbiorcę (klient indywidualny)", stawka: "{{fakt:oplata.zagraniczne.poszukiwanie-ind}}", tryb: "za zlecenie"}
