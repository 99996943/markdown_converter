  - id: taryfa-karty-objasnienia
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: objasnienia-taryfa-karty
    elementy:
      - ustep: "Użyte w Taryfie określenie „za operację” oznacza opłatę pobieraną za każdą pojedynczą wypłatę, wpłatę lub zapytanie; „od kwoty transakcji” — opłatę liczoną procentowo od wartości transakcji; „miesięcznie” i „rocznie” — opłatę naliczaną cyklicznie, za dany miesiąc lub rok użytkowania karty."
      - ustep: "Zwrot opłaty za kartę pobranej za okres, w którym karta nie była użytkowana z powodu jej zastrzeżenia, następuje {na wniosek|po złożeniu wniosku} klienta, w terminie {{fakt:termin.zwrot-oplat}} od dnia jego otrzymania."
      - ustep: "Informacje o opłatach za transakcje wykonane kartą są prezentowane w zestawieniu transakcji lub w historii rachunku. Zakwestionowanie opłaty {odbywa się|następuje} w trybie reklamacji, zgodnie z regulaminem karty, w terminie nie dłuższym niż {{fakt:karta.zgloszenie-nieautoryzowanej}} od dnia obciążenia rachunku."
      - akapit: "Opłaty, o których mowa w Taryfie, są wyrażone w złotych; obciążenia w walutach obcych przelicza się według zasad określonych w postanowieniach ogólnych i w sekcji dotyczącej operacji za granicą. Opłaty nie zawierają należności osób trzecich, w tym operatorów bankomatów, które mogą być pobierane dodatkowo."
