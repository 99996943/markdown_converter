bloki:
  # ---------- Karty kredytowe ----------
  - id: taryfa-karty-kredytowe-wstep
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: wstep-taryfa-karty
    elementy:
      - akapit: "Karta kredytowa umożliwia {dokonywanie|wykonywanie} transakcji do wysokości przyznanego limitu kredytowego, który wynosi od {{fakt:limit.karta.kredytowy-min}} do {{fakt:limit.karta.kredytowy-max}}. Wysokość limitu {ustala|określa} Bank na podstawie oceny zdolności kredytowej wnioskodawcy."
      - akapit: "Poniższe opłaty i prowizje {są niezależne od|nie obejmują} odsetek od wykorzystanego limitu. Oprocentowanie wynosi {{fakt:oprocentowanie.karta.zakupy}} w stosunku rocznym dla transakcji bezgotówkowych oraz {{fakt:oprocentowanie.karta.gotowka}} dla wypłat gotówki; kredyt na zakupy rozłożone na raty jest oprocentowany stawką {{fakt:oprocentowanie.karta.rata}}."

  - id: taryfa-karty-kredytowe-podstawowe
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: podstawowe-taryfa-karty
    elementy:
      - pozycje-taryfy:
          - usluga: "{Wydanie|Wystawienie} karty kredytowej"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-wydanie}}"
            tryb: "jednorazowo"
          - usluga: "Roczna opłata za kartę kredytową[^1]"
            stawka: "{{fakt:oplata.karta.roczna}}"
            tryb: "rocznie"
          - usluga: "Roczna opłata za dodatkową kartę kredytową"
            stawka: "{{fakt:oplata.karta.dodatkowa-roczna}}"
            tryb: "rocznie"
          - usluga: "Wydanie duplikatu karty kredytowej"
            stawka: "{{fakt:oplata.karta.wydanie-duplikatu}}"
            tryb: "jednorazowo"
          - usluga: "Pilna wymiana karty kredytowej[^2]"
            stawka: "{{fakt:oplata.karta.pilna-wymiana}}"
            tryb: "jednorazowo"
          - usluga: "Zastrzeżenie karty kredytowej"
            stawka: "{{fakt:oplata.karta.zastrzezenie}}"
            tryb: "jednorazowo"
          - usluga: "Wypłata gotówki z karty kredytowej w bankomacie lub w placówce"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty wypłaty"
          - usluga: "{Przelew|Przelew środków} z karty kredytowej na rachunek"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-przelew-z-karty}}"
            tryb: "od kwoty przelewu"
          - usluga: "Zakupy ratalne z karty kredytowej: prowizja przygotowawcza"
            stawka: "{{fakt:oplata.karta.prowizja-rata}}"
            tryb: "od kwoty transakcji"
          - usluga: "Przekroczenie przyznanego limitu kredytowego"
            stawka: "{{fakt:oplata.karta.przekroczenie-limitu}}"
            tryb: "za każde przekroczenie"
          - usluga: "Zwiększenie limitu kredytowego na wniosek klienta"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-zwiekszenie-limitu}}"
            tryb: "jednorazowo"
          - usluga: "Zmiana terminu spłaty zadłużenia na karcie"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-zmiana-terminu-splaty}}"
            tryb: "za każdą zmianę"
          - usluga: "Upomnienie w związku z opóźnieniem w spłacie minimalnej kwoty"
            stawka: "{{fakt:oplata.upomnienie}}"
            tryb: "za każde upomnienie"
          - usluga: "Restrukturyzacja zadłużenia na karcie na wniosek klienta"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-restrukturyzacja}}"
            tryb: "jednorazowo"
          - usluga: "Papierowe zestawienie transakcji doręczane pocztą"
            stawka: "{{fakt:oplata.wyciag-papierowy}}"
            tryb: "za zestawienie"
          - usluga: "Elektroniczne zestawienie transakcji w bankowości elektronicznej"
            stawka: "bez opłat"
            tryb: "za zestawienie"
          - usluga: "Spłata zadłużenia na karcie w placówce Banku"
            stawka: "{{fakt:oplata.wplata-gotowkowa}}"
            tryb: "za wpłatę"
          - usluga: "Spłata zadłużenia przelewem z rachunku w Banku"
            stawka: "bez opłat"
            tryb: "za operację"
    przypisy:
      1: "Opłata nie jest pobierana za dany rok użytkowania, jeżeli łączna wartość transakcji bezgotówkowych wykonanych kartą w poprzednich dwunastu miesiącach wyniosła co najmniej {{fakt:oplata.taryfa-karty.kredytowa-prog-zwolnienia-rocznej}}."
      2: "Nowa karta jest doręczana w ciągu {{fakt:termin.karta.wydanie}} od dnia złożenia dyspozycji; opłatę pobiera się w dniu zamówienia karty."

  - id: taryfa-karty-kredytowe-opc-1
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Rozpatrzenie|Rozpatrzenie i ocena} wniosku o kartę kredytową w terminie {{fakt:termin.karta.rozpatrzenie-wniosku}}"
            stawka: "bez opłat"
            tryb: "za wniosek"
          - usluga: "Wydanie karty kredytowej po rozpatrzeniu wniosku w terminie {{fakt:termin.karta.wydanie}}"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Aktywacja karty kredytowej w bankowości elektronicznej"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Zmiana numeru PIN do karty kredytowej"
            stawka: "{{fakt:oplata.karta-debetowa.zmiana-pin}}"
            tryb: "za każdą zmianę"
          - usluga: "Ponowne wysłanie numeru PIN do karty kredytowej"
            stawka: "6,00 zł"
            tryb: "za przesyłkę"
          - usluga: "{Zmniejszenie|Obniżenie} limitu kredytowego na wniosek klienta"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Czasowa blokada karty kredytowej"
            stawka: "bez opłat"
            tryb: "za każdą blokadę"
          - usluga: "Rezygnacja z karty kredytowej w terminie {{fakt:termin.odstapienie-od-umowy}} od zawarcia umowy"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Zamknięcie karty kredytowej po całkowitej spłacie zadłużenia"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Informacja o niewznowieniu karty, przekazywana {{fakt:termin.karta.niewznowienie}} przed upływem ważności"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-kredytowe-opc-2
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "Zestawienie transakcji: doręczenie w terminie {{fakt:termin.karta.dostarczenie-zestawienia}} po zamknięciu okresu rozliczeniowego"
            stawka: "bez opłat"
            tryb: "za zestawienie"
          - usluga: "Duplikat zestawienia transakcji za okres do 12 miesięcy wstecz"
            stawka: "{{fakt:oplata.duplikat-umowy}}"
            tryb: "za dokument"
          - usluga: "Duplikat zestawienia transakcji za okres powyżej 12 miesięcy wstecz"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za dokument"
          - usluga: "Zaświadczenie o wysokości zadłużenia na karcie kredytowej"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za dokument"
          - usluga: "Zaświadczenie o spłacie zadłużenia i zamknięciu karty"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za dokument"
          - usluga: "Informacja o historii spłat karty dla innej instytucji finansowej"
            stawka: "30,00 zł"
            tryb: "za dokument"
          - usluga: "Kopia umowy o kartę kredytową"
            stawka: "{{fakt:oplata.duplikat-umowy}}"
            tryb: "za dokument"
          - usluga: "Powiadomienie o transakcji kartą kredytową w aplikacji mobilnej"
            stawka: "bez opłat"
            tryb: "za powiadomienie"
          - usluga: "{Powiadomienie|Informacja} o saldzie i terminie spłaty wiadomością tekstową"
            stawka: "{{fakt:oplata.powiadomienie-sms}}"
            tryb: "za wiadomość"
          - usluga: "Przypomnienie o terminie spłaty w aplikacji mobilnej"
            stawka: "bez opłat"
            tryb: "za przypomnienie"

  - id: taryfa-karty-kredytowe-opc-3
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "Spłata minimalna: {{fakt:splata.karta.minimum-procent}} zadłużenia, nie mniej niż {{fakt:splata.karta.minimum-kwota}}"
            stawka: "wg umowy"
            tryb: "miesięcznie"
          - usluga: "Okres bezodsetkowy na transakcje bezgotówkowe do {{fakt:termin.karta.okres-bezodsetkowy}}"
            stawka: "bez opłat"
            tryb: "za okres rozliczeniowy"
          - usluga: "Spłata zadłużenia w terminie {{fakt:termin.karta.splata-po-zestawieniu}} od daty zestawienia"
            stawka: "bez opłat"
            tryb: "za okres rozliczeniowy"
          - usluga: "Wezwanie do zapłaty po upływie {{fakt:termin.karta.wezwanie-do-zaplaty}} opóźnienia"
            stawka: "{{fakt:oplata.upomnienie}}"
            tryb: "za wezwanie"
          - usluga: "Odsetki za opóźnienie w spłacie zadłużenia przeterminowanego"
            stawka: "{{fakt:oprocentowanie.odsetki-za-opoznienie}}"
            tryb: "rocznie"
          - usluga: "Rozłożenie transakcji kartowej na raty"
            stawka: "{{fakt:oprocentowanie.karta.rata}}"
            tryb: "rocznie"
          - usluga: "Wcześniejsza spłata zadłużenia ratalnego"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Odroczenie spłaty karty na wniosek klienta (do dwóch miesięcy)"
            stawka: "25,00 zł"
            tryb: "za każde odroczenie"
          - usluga: "Konsolidacja zadłużenia z kilku kart w jednej karcie"
            stawka: "1,0% min. 20,00 zł"
            tryb: "od kwoty konsolidacji"
          - usluga: "Ugoda w sprawie spłaty zadłużenia po wypowiedzeniu umowy"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-kredytowe-opc-4
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "Karta kredytowa w pakiecie premium: roczna opłata za kartę"
            stawka: "{{fakt:oplata.karta.roczna}}"
            tryb: "rocznie"
            podpozycje:
              - usluga: "w pierwszym roku użytkowania"
                stawka: "bez opłat"
                tryb: "rocznie"
              - usluga: "w kolejnych latach"
                stawka: "{{fakt:oplata.karta.roczna}}"
                tryb: "rocznie"
          - usluga: "Wypłata gotówki z karty kredytowej w bankomacie Banku"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty wypłaty"
          - usluga: "Wypłata gotówki z karty kredytowej w bankomacie innego operatora"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty wypłaty"
          - usluga: "Transakcja kartą kredytową w kasynie lub u organizatora zakładów wzajemnych"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty transakcji"
          - usluga: "Doładowanie karty przedpłaconej lub portfela elektronicznego kartą kredytową"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty transakcji"
          - usluga: "Zakup walut lub czeków podróżnych kartą kredytową"
            stawka: "{{fakt:oplata.karta.gotowka-prowizja}}, min. {{fakt:oplata.karta.gotowka-minimum}}"
            tryb: "od kwoty transakcji"
          - usluga: "Płatność kartą kredytową za rachunki i opłaty publiczne"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Płatność kartą kredytową w sklepach internetowych"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Płatność zbliżeniowa do kwoty {{fakt:limit.karta.bez-pin}} bez PIN"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Dzienny limit transakcji internetowych w wysokości do {{fakt:limit.karta.dzienny-internet}}"
            stawka: "bez opłat"
            tryb: "dziennie"

  - id: taryfa-karty-kredytowe-opc-5
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Dzienny|Dobowy} limit wypłat gotówki z karty kredytowej w wysokości do {{fakt:limit.karta.dzienny-gotowkowy}}"
            stawka: "bez opłat"
            tryb: "dziennie"
          - usluga: "Dzienny limit transakcji bezgotówkowych w wysokości do {{fakt:limit.karta.dzienny-bezgotowkowy}}"
            stawka: "bez opłat"
            tryb: "dziennie"
          - usluga: "Zmiana dziennych limitów transakcji kartą kredytową"
            stawka: "bez opłat"
            tryb: "za każdą zmianę"
          - usluga: "Ustawienie limitu na transakcje w internecie"
            stawka: "bez opłat"
            tryb: "za każdą zmianę"
          - usluga: "Zgłoszenie utraty karty kredytowej pod numerem infolinii {{fakt:kontakt.infolinia-zastrzezenia}}"
            stawka: "bez opłat"
            tryb: "za zgłoszenie"
          - usluga: "Zgłoszenie utraty karty kredytowej z zagranicy pod numerem {{fakt:kontakt.infolinia-zagranica}}"
            stawka: "wg taryfy operatora"
            tryb: "za połączenie"
          - usluga: "Wydanie karty zastępczej po zastrzeżeniu"
            stawka: "{{fakt:oplata.karta.wydanie-duplikatu}}"
            tryb: "jednorazowo"
          - usluga: "Wydanie karty kredytowej z nowym numerem po wykryciu próby oszustwa"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Odwołanie nieuznanej transakcji w trybie reklamacji kartowej"
            stawka: "bez opłat"
            tryb: "za reklamację"
          - usluga: "Odwołanie transakcji uznanej za prawidłowo autoryzowaną[^1]"
            stawka: "{{fakt:oplata.taryfa-karty.reklamacja-nieuzasadniona}}"
            tryb: "za reklamację"
    przypisy:
      1: "Opłata jest pobierana, gdy z dokumentacji transakcji wynika, że została ona potwierdzona przez użytkownika karty zgodnie z regulaminem karty kredytowej."

  - id: taryfa-karty-kredytowe-opc-6
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "Zwolnienie z rocznej opłaty za kartę po osiągnięciu obrotów {{fakt:oplata.taryfa-karty.kredytowa-prog-zwolnienia-rocznej}} w ciągu roku"
            stawka: "bez opłat"
            tryb: "rocznie"
          - usluga: "Zmiana rodzaju karty kredytowej na kartę o wyższym limicie"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Zmiana rodzaju karty kredytowej na kartę o niższym limicie"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Przeniesienie zadłużenia z karty innego wydawcy"
            stawka: "1,5% min. 25,00 zł"
            tryb: "od kwoty przeniesienia"
          - usluga: "Zmiana adresu korespondencyjnego dla zestawień"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Zmiana sposobu doręczania zestawień (papierowo lub elektronicznie)"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Dodanie karty kredytowej do portfela płatności mobilnych"
            stawka: "bez opłat"
            tryb: "za urządzenie"
          - usluga: "Zawieszenie karty na czas wyjazdu zagranicznego"
            stawka: "bez opłat"
            tryb: "za zawieszenie"
          - usluga: "Zwrot nadpłaty z karty kredytowej na rachunek wskazany przez klienta"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Zwrot nadpłaty z karty kredytowej na rachunek w innym banku"
            stawka: "{{fakt:oplata.przelew-zewnetrzny-placowka}}"
            tryb: "za przelew"
