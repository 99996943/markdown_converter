            stawka: "bez opłat"
            tryb: "za zgłoszenie"
          - usluga: "Zmiana dziennego limitu transakcji zagranicznych"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Odblokowanie karty zablokowanej za granicą z powodu podejrzenia nadużycia"
            stawka: "bez opłat"
            tryb: "za odblokowanie"
          - usluga: "Przekazanie kodu jednorazowego do transakcji zagranicznej za pośrednictwem infolinii"
            stawka: "bez opłat"
            tryb: "za kod"
          - usluga: "Wysłanie wiadomości tekstowej z kodem na numer zagraniczny"
            stawka: "{{fakt:oplata.powiadomienie-sms}}"
            tryb: "za wiadomość"
          - usluga: "Wysłanie nowego numeru PIN pocztą na adres za granicą"
            stawka: "25,00 zł"
            tryb: "za przesyłkę"
          - usluga: "Wystawienie karty tymczasowej do wypłat w bankomacie na czas podróży"
            stawka: "{{fakt:oplata.taryfa-karty.przedplacona-wydanie}}"
            tryb: "jednorazowo"
          - usluga: "Dokumentacja transakcji zagranicznej na potrzeby rozliczenia delegacji"
            stawka: "{{fakt:oplata.taryfa-karty.potwierdzenie-transakcji}}"
            tryb: "za dokument"
          - usluga: "Zaświadczenie o limitach transakcji zagranicznych dla konsulatu"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za dokument"
          - usluga: "Zgłoszenie szkody z tytułu kradzieży karty za granicą do ubezpieczyciela"
            stawka: "bez opłat"
            tryb: "za zgłoszenie"

