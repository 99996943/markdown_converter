    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-uslugi
    elementy:
      - pozycje-taryfy:
          - usluga: "{Program|Pakiet} lojalnościowy dla użytkowników kart: uczestnictwo"
