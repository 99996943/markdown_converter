bloki:
  - id: taryfa-karty-debetowe-opc-6
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-debetowe
    elementy:
      - pozycje-taryfy:
          - usluga: "Karta debetowa w pakiecie podróżnika: {prowadzenie|miesięczna opłata za kartę}"
            stawka: "{{fakt:oplata.karta-debetowa.prowadzenie-miesieczna}}"
            tryb: "miesięcznie"
          - usluga: "Karta debetowa w pakiecie podróżnika: wypłata gotówki w bankomacie za granicą"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Karta debetowa dla klienta o wysokich wpływach: prowadzenie"
            stawka: "bez opłat"
            tryb: "miesięcznie"
          - usluga: "Karta debetowa z funkcją płatności mobilnych na zegarku lub opasce"
            stawka: "bez opłat"
            tryb: "za urządzenie"
          - usluga: "Odnowienie tokenu karty w urządzeniu mobilnym po wznowieniu karty"
            stawka: "bez opłat"
            tryb: "za urządzenie"
          - usluga: "Zmiana waluty rozliczeń transakcji kartą na rachunek walutowy"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Powiązanie karty z kolejnym rachunkiem klienta"
            stawka: "{{fakt:oplata.taryfa-karty.debetowa-zmiana-limitu}}"
            tryb: "za zmianę"
          - usluga: "Odłączenie karty od rachunku współposiadacza"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Wydanie karty dla pełnomocnika do rachunku osobistego"
            stawka: "{{fakt:oplata.taryfa-karty.debetowa-karta-dodatkowa}}"
            tryb: "miesięcznie"
          - usluga: "Odwołanie pełnomocnika i zamknięcie jego karty"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-debetowe-opc-7
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-debetowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Wypłata|Pobranie} gotówki w bankomacie Banku w ramach limitu {{fakt:limit.karta.dzienny-gotowkowy}} dziennie"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Płatności bezgotówkowe w ramach limitu {{fakt:limit.karta.dzienny-bezgotowkowy}} dziennie"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Wypłata gotówki w wysokości powyżej limitu dziennego za zgodą Banku"
            stawka: "0,5% min. 10,00 zł"
            tryb: "od kwoty wypłaty"
          - usluga: "Transakcja kartą w automacie samoobsługowym (parking, bilety, paliwo)"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Płatność za rachunki za pomocą karty w bankomacie wielofunkcyjnym"
            stawka: "2,00 zł"
            tryb: "za operację"
          - usluga: "Przelew z kodu zapisanego w aplikacji, zlecony za pomocą karty"
            stawka: "{{fakt:oplata.przelew-natychmiastowy}}"
            tryb: "za przelew"
          - usluga: "Zakup kodów doładowujących telefon komórkowy w bankomacie Banku"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Wypłata gotówki bez użycia karty z użyciem kodu jednorazowego w bankomacie Banku"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Wpłata gotówki we wpłatomacie bez użycia karty z kodu jednorazowego"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Płatność kartą debetową w stacji ładowania pojazdu elektrycznego"
            stawka: "bez opłat"
            tryb: "za transakcję"

  - id: taryfa-karty-kredytowe-opc-7
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Karta|Wydanie karty} kredytowej w wariancie złotym: roczna opłata"
            stawka: "{{fakt:oplata.karta.roczna}}"
            tryb: "rocznie"
          - usluga: "Karta kredytowa w wariancie złotym: dostęp do poczekalni lotniskowych"
            stawka: "49,00 zł"
            tryb: "za wejście"
          - usluga: "Karta kredytowa w wariancie złotym: ubezpieczenie podróży w cenie karty"
            stawka: "bez opłat"
            tryb: "rocznie"
          - usluga: "Karta kredytowa w wariancie standardowym: roczna opłata"
            stawka: "{{fakt:oplata.karta.roczna}}"
            tryb: "rocznie"
          - usluga: "Karta kredytowa dla studenta: roczna opłata w pierwszych dwóch latach"
            stawka: "bez opłat"
            tryb: "rocznie"
          - usluga: "Karta kredytowa dla studenta: roczna opłata w kolejnych latach"
            stawka: "{{fakt:oplata.karta.dodatkowa-roczna}}"
            tryb: "rocznie"
          - usluga: "Karta kredytowa współbieżna dla małżonka: roczna opłata"
            stawka: "{{fakt:oplata.karta.dodatkowa-roczna}}"
            tryb: "rocznie"
          - usluga: "Limit karty dla karty dodatkowej ustalony przez głównego użytkownika"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Zmiana wariantu karty kredytowej w trakcie umowy"
            stawka: "{{fakt:oplata.taryfa-karty.kredytowa-zmiana-terminu-splaty}}"
            tryb: "jednorazowo"
          - usluga: "Wydanie karty kredytowej z limitem początkowym do {{fakt:limit.karta.kredytowy-min}}"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-kredytowe-opc-8
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-kredytowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Zawieszenie|Wstrzymanie} naliczania opłat w razie utraty pracy na wniosek klienta"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Odstąpienie od umowy o kartę kredytową: zwrot poniesionych opłat"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Wypowiedzenie umowy o kartę kredytową przez klienta"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Wypowiedzenie umowy o kartę kredytową przez Bank"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Zwrot proporcjonalnej części opłaty rocznej po wcześniejszym zamknięciu karty"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Informacja o stanie zadłużenia na potrzeby kredytu hipotecznego"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za dokument"
          - usluga: "Zmiana waluty rozliczenia karty kredytowej"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Spłata zadłużenia z karty kredytowej w innym banku (przelew przychodzący)"
            stawka: "bez opłat"
            tryb: "za przelew"
          - usluga: "Spłata zadłużenia z karty kredytowej wpłatą na rachunek karty w oddziale"
            stawka: "{{fakt:oplata.wplata-gotowkowa}}"
            tryb: "za wpłatę"
          - usluga: "Windykacja zadłużenia na karcie: wezwanie ostateczne"
            stawka: "{{fakt:oplata.upomnienie}}"
            tryb: "za każde wezwanie"

  - id: taryfa-karty-przedplacone-opc-5
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-przedplacone
    elementy:
      - pozycje-taryfy:
          - usluga: "{Karta|Wydanie karty} przedpłacona wielowalutowa: opłata za wydanie"
            stawka: "{{fakt:oplata.taryfa-karty.przedplacona-wydanie}}"
            tryb: "jednorazowo"
          - usluga: "Karta przedpłacona wielowalutowa: przewalutowanie salda między walutami"
            stawka: "marża {{fakt:kurs.marza-przeliczen}}"
            tryb: "od kwoty przewalutowania"
          - usluga: "Karta przedpłacona turystyczna: prowadzenie"
            stawka: "{{fakt:oplata.taryfa-karty.przedplacona-prowadzenie}}"
            tryb: "miesięcznie"
          - usluga: "Karta przedpłacona turystyczna: wypłata w bankomacie za granicą"
            stawka: "{{fakt:oplata.karta-debetowa.wyplata-bankomat-zagranica}}"
            tryb: "za operację"
          - usluga: "Karta przedpłacona turystyczna: wymiana waluty w aplikacji"
            stawka: "marża {{fakt:kurs.marza-przeliczen}}"
            tryb: "od kwoty przewalutowania"
          - usluga: "Karta przedpłacona dla pracownika: doładowanie zbiorcze przez pracodawcę"
            stawka: "wg umowy"
            tryb: "za doładowanie"
          - usluga: "Karta przedpłacona dla pracownika: zwrot salda pracodawcy"
            stawka: "{{fakt:oplata.taryfa-karty.przedplacona-zwrot-salda}}"
            tryb: "jednorazowo"
          - usluga: "Karta przedpłacona na prezent: doładowanie jednorazowe"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Karta przedpłacona na prezent: ważność 12 miesięcy bez opłaty za prowadzenie"
            stawka: "bez opłat"
            tryb: "miesięcznie"
          - usluga: "Karta przedpłacona na prezent: aktywacja przez obdarowanego"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-przedplacone-opc-6
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-przedplacone
    elementy:
      - pozycje-taryfy:
          - usluga: "{Reklamacja|Zgłoszenie reklamacji} transakcji kartą przedpłaconą uznanej za zasadną"
            stawka: "bez opłat"
            tryb: "za reklamację"
          - usluga: "Reklamacja transakcji kartą przedpłaconą uznanej za niezasadną"
            stawka: "{{fakt:oplata.taryfa-karty.reklamacja-nieuzasadniona}}"
            tryb: "za reklamację"
          - usluga: "Zwrot środków z nieautoryzowanej transakcji kartą przedpłaconą"
            stawka: "bez opłat"
            tryb: "za zwrot"
          - usluga: "Zgłoszenie nieautoryzowanej transakcji w terminie {{fakt:karta.zgloszenie-nieautoryzowanej}}"
            stawka: "bez opłat"
            tryb: "za zgłoszenie"
          - usluga: "Blokada karty przedpłaconej na wniosek posiadacza"
            stawka: "bez opłat"
            tryb: "za blokadę"
          - usluga: "Odblokowanie karty przedpłaconej po wyjaśnieniu sprawy"
            stawka: "bez opłat"
            tryb: "za odblokowanie"
          - usluga: "Odblokowanie karty zablokowanej przez Bank z powodu podejrzenia nadużycia"
            stawka: "bez opłat"
            tryb: "za odblokowanie"
          - usluga: "Zmiana danych posiadacza karty imiennej"
            stawka: "bez opłat"
            tryb: "za zmianę"
          - usluga: "Przeniesienie karty na innego posiadacza"
            stawka: "nie jest możliwe"
            tryb: "—"
          - usluga: "Weryfikacja salda karty na wniosek spadkobierców posiadacza"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-firmowe-opc-5
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-firmowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Karta|Wydanie karty} firmowa dla jednoosobowej działalności gospodarczej: prowadzenie"
            stawka: "{{fakt:oplata.taryfa-karty.firmowa-prowadzenie}}"
            tryb: "miesięcznie"
          - usluga: "Karta firmowa dla spółki: prowadzenie karty pierwszego użytkownika"
            stawka: "{{fakt:oplata.taryfa-karty.firmowa-prowadzenie}}"
            tryb: "miesięcznie"
          - usluga: "Karta firmowa dla rolnika prowadzącego gospodarstwo: prowadzenie"
            stawka: "8,00 zł"
            tryb: "miesięcznie"
          - usluga: "Karta firmowa dla organizacji pozarządowej: prowadzenie"
            stawka: "bez opłat"
            tryb: "miesięcznie"
          - usluga: "Karta firmowa dla wspólnoty mieszkaniowej: prowadzenie"
            stawka: "5,00 zł"
            tryb: "miesięcznie"
          - usluga: "Karta firmowa dla spółdzielni: wydanie"
            stawka: "{{fakt:oplata.taryfa-karty.firmowa-wydanie}}"
            tryb: "jednorazowo"
          - usluga: "Zwolnienie z opłaty za prowadzenie kart firmowych przy obrotach powyżej {{fakt:oplata.taryfa-karty.debetowa-prog-zwolnienia}} miesięcznie"
            stawka: "bez opłat"
            tryb: "miesięcznie"
          - usluga: "Wydanie karty firmowej w ramach promocji dla nowych klientów firmowych"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Karta firmowa z funkcją płatności mobilnych"
            stawka: "bez opłat"
            tryb: "za urządzenie"
          - usluga: "Karta firmowa wirtualna do płatności w internecie"
            stawka: "bez opłat"
            tryb: "jednorazowo"

  - id: taryfa-karty-firmowe-opc-6
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-firmowe
    elementy:
      - pozycje-taryfy:
          - usluga: "{Wypłata|Pobranie} gotówki kartą firmową w bankomacie Banku do limitu dziennego"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Wypłata gotówki kartą firmową w bankomacie za granicą"
            stawka: "{{fakt:oplata.karta-debetowa.wyplata-bankomat-zagranica}}"
            tryb: "za operację"
          - usluga: "Wpłata utargu we wpłatomacie Banku do kwoty {{fakt:limit.karta-debetowa.maksymalna-wplata-wplatomat}} miesięcznie"
            stawka: "bez opłat"
            tryb: "za operację"
          - usluga: "Wpłata utargu we wpłatomacie Banku powyżej kwoty bezpłatnej"
            stawka: "0,1% min. 3,00 zł"
            tryb: "od kwoty wpłaty"
          - usluga: "Wpłata utargu w workach zamykanych w oddziale"
            stawka: "0,2% min. 10,00 zł"
            tryb: "od kwoty wpłaty"
          - usluga: "Rozliczenie transakcji kartą firmową w terminie {{fakt:termin.karta-debetowa.rozliczenie-transakcji}}"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Płatność kartą firmową w internecie"
            stawka: "bez opłat"
            tryb: "za transakcję"
          - usluga: "Płatność kartą firmową za granicą w walucie obcej"
            stawka: "marża {{fakt:kurs.marza-przeliczen}}"
            tryb: "od kwoty transakcji"
          - usluga: "Zwrot transakcji kartą firmową zrealizowany przez akceptanta"
            stawka: "bez opłat"
            tryb: "za zwrot"
          - usluga: "Zestawienie transakcji karty firmowej dla pojedynczego użytkownika"
            stawka: "bez opłat"
            tryb: "za zestawienie"

  - id: taryfa-karty-zagranica-opc-5
    typy: [taryfy]
    tematy: [taryfa-karty]
    kategoria: pozycje-taryfa-karty-zagranica
    elementy:
      - pozycje-taryfy:
          - usluga: "{Informacja|Wiadomość} o kursie przeliczenia transakcji zagranicznej w aplikacji mobilnej"
            stawka: "bez opłat"
            tryb: "za informację"
          - usluga: "Tabela kursów walut Banku w bankowości elektronicznej"
            stawka: "bez opłat"
            tryb: "za dostęp"
          - usluga: "Tabela kursów walut Banku sporządzana o godzinie {{fakt:kurs.godzina-tabeli}} w dni robocze"
            stawka: "bez opłat"
            tryb: "za dostęp"
          - usluga: "Kurs wymiany walut w placówce Banku przy realizacji transakcji kartą"
            stawka: "wg kursu Banku"
            tryb: "od kwoty transakcji"
          - usluga: "Przeliczenie transakcji w walucie nieobjętej tabelą po kursie średnim operatora rozliczeń"
            stawka: "marża 3,0%"
            tryb: "od kwoty transakcji"
          - usluga: "Zlecenie stałe zasilania karty przedpłaconej w walucie obcej"
            stawka: "bez opłat"
            tryb: "za zlecenie"
          - usluga: "Zwrot transakcji zagranicznej, gdy kurs z dnia zwrotu jest niższy niż z dnia transakcji"
            stawka: "wg kursu z dnia zwrotu"
            tryb: "od kwoty zwrotu"
          - usluga: "Korekta przewalutowania po reklamacji uznanej za zasadną"
            stawka: "bez opłat"
            tryb: "za korektę"
          - usluga: "Potwierdzenie przewalutowania transakcji wydane na wniosek"
            stawka: "{{fakt:oplata.taryfa-karty.potwierdzenie-transakcji}}"
            tryb: "za dokument"
          - usluga: "Wyłączenie przewalutowania dynamicznego (blokada wyboru waluty u akceptanta)"
            stawka: "bez opłat"
            tryb: "za zmianę"

