bloki:
  - id: taryfa-kredyty-gotowkowe-pozycje
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-wymagane-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "{Prowizja|Opłata} za przygotowanie i udzielenie kredytu gotówkowego"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.prowizja-przygotowanie}} min. {{fakt:oplata.kredyt-gotowkowy.prowizja-minimalna}}[^1]"
            tryb: "od kwoty kredytu, jednorazowo"
            podpozycje:
              - usluga: "kredyt w kwocie do 20 000,00 zł"
                stawka: "{{fakt:oplata.kredyt-gotowkowy.prowizja-przygotowanie}}"
                tryb: "od kwoty kredytu"
              - usluga: "kredyt w kwocie powyżej 20 000,00 zł"
                stawka: "{{fakt:oplata.kredyt-gotowkowy.prowizja-przygotowanie}}, nie więcej niż 6 000,00 zł"
                tryb: "od kwoty kredytu"
          - usluga: "Odnowienie kredytu w ramach pożyczki odnawialnej"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.prowizja-odnowienie}}"
            tryb: "od kwoty odnowienia"
          - usluga: "Składka za ubezpieczenie spłaty kredytu (opcjonalne)[^2]"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.ubezpieczenie-splaty}}"
            tryb: "od kwoty kredytu, jednorazowo"
          - usluga: "{Wcześniejsza|Przedterminowa} spłata kredytu — część kredytu pozostająca do spłaty powyżej 12 miesięcy"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.wczesna-splata-powyzej-roku}}[^3]"
            tryb: "od spłaconego kapitału"
          - usluga: "{Wcześniejsza|Przedterminowa} spłata kredytu — część kredytu pozostająca do spłaty do 12 miesięcy"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.wczesna-splata-do-roku}}[^3]"
            tryb: "od spłaconego kapitału"
          - usluga: "Zmiana terminu spłaty raty (przesunięcie dnia płatności)"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.zmiana-terminu-splaty}}"
            tryb: "za każdą zmianę"
          - usluga: "Zawieszenie spłaty rat kapitałowych (wakacje kredytowe)"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.wakacje-kredytowe}}"
            tryb: "za każde zawieszenie"
          - usluga: "Zmiana rachunku, z którego spłacany jest kredyt"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.zmiana-rachunku-splaty}}"
            tryb: "za każdą zmianę"
          - usluga: "Sporządzenie duplikatu harmonogramu spłat"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.harmonogram-duplikat}}"
            tryb: "za każdy dokument"
          - usluga: "Zaświadczenie o spłacie kredytu lub o braku zadłużenia"
            stawka: "{{fakt:oplata.zaswiadczenie}}"
            tryb: "za każde zaświadczenie"
          - usluga: "Sporządzenie duplikatu umowy kredytu"
            stawka: "{{fakt:oplata.duplikat-umowy}}"
            tryb: "za każdy dokument"
          - usluga: "Wniosek o restrukturyzację zadłużenia — rozpatrzenie"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.restrukturyzacja}}"
            tryb: "jednorazowo"
          - usluga: "Wysłanie wyciągu lub harmonogramu w formie papierowej"
            stawka: "{{fakt:oplata.wyciag-papierowy}}"
            tryb: "za każdy dokument"
          - usluga: "Wcześniejsza spłata całości kredytu w terminie odstąpienia od umowy"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Rozpatrzenie wniosku o kredyt gotówkowy"
            stawka: "bez opłat"
            tryb: "jednorazowo"
    przypisy:
      1: "Prowizja {jest pobierana|jest potrącana} z kwoty kredytu w dniu uruchomienia albo — na wniosek Klienta — doliczana do kwoty kredytu; w razie niedojścia umowy do skutku prowizji się nie pobiera."
      2: "Zawarcie umowy ubezpieczenia nie jest warunkiem udzielenia kredytu; {składka|opłata} jest przekazywana ubezpieczycielowi, a nie stanowi przychodu Banku."
      3: "Opłaty nie pobiera się, jeżeli spłata następuje ze środków pochodzących z ubezpieczenia albo gdy kwota spłacona w ciągu 12 miesięcy nie przekracza 10 000,00 zł; łączna opłata nie może przekroczyć odsetek, które Klient zapłaciłby do dnia ostatecznej spłaty."

  - id: taryfa-kredyty-gotowkowe-opc-1
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "{Prowizja|Opłata} za uruchomienie kredytu w transzach"
            stawka: "0,3% kwoty transzy min. 20,00 zł"
            tryb: "za każdą transzę"
          - usluga: "{Kredyt ratalny|Pożyczka ratalna} na zakup towarów i usług — prowizja"
            stawka: "wg umowy, nie więcej niż 2,5%"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt konsolidacyjny — prowizja za przygotowanie"
            stawka: "2,0% min. 100,00 zł"
            tryb: "od kwoty kredytu"
            podpozycje:
              - usluga: "konsolidacja zobowiązań własnych w Banku"
                stawka: "1,5%"
                tryb: "od kwoty konsolidowanej"
              - usluga: "konsolidacja zobowiązań w innych instytucjach"
                stawka: "2,0%"
                tryb: "od kwoty konsolidowanej"
          - usluga: "Przelew środków kredytu na rachunek innej instytucji kredytowej w celu konsolidacji"
            stawka: "bez opłat"
            tryb: "za każdy przelew"
          - usluga: "Kredyt dla osób z rachunkiem osobistym w Banku — obniżenie prowizji"
            stawka: "minus 0,5 pkt proc."
            tryb: "od stawki prowizji"
          - usluga: "{Wydłużenie|Przedłużenie} okresu kredytowania o 12 miesięcy"
            stawka: "0,5% salda kapitału min. 80,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zgoda {Banku|kredytodawcy} na zmianę przeznaczenia kredytu"
            stawka: "40,00 zł"
            tryb: "jednorazowo"
          - usluga: "Opłata za {wcześniejsze|przyspieszone} udostępnienie środków (uruchomienie w dniu złożenia wniosku)"
            stawka: "30,00 zł"
            tryb: "jednorazowo"
          - usluga: "Uruchomienie kredytu w placówce Banku w gotówce"
            stawka: "0,5% min. 10,00 zł"
            tryb: "od kwoty wypłaty"
          - usluga: "Przygotowanie projektu umowy z uwzględnieniem szczególnych warunków wskazanych przez Klienta"
            stawka: "wg umowy"
            tryb: "jednorazowo"

  - id: taryfa-kredyty-gotowkowe-opc-2
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "{Zaświadczenie|Informacja pisemna} o wysokości zadłużenia na dzień wskazany przez Klienta"
            stawka: "30,00 zł"
            tryb: "za każde zaświadczenie"
          - usluga: "Zaświadczenie wydane w terminie {{fakt:termin.kredyt-gotowkowy.wydanie-zaswiadczenia}} od wniosku"
            stawka: "bez opłat"
            tryb: "pierwsze w roku kalendarzowym"
          - usluga: "Zaświadczenie dla biura informacji kredytowej o {historii spłat|przebiegu spłat}"
            stawka: "25,00 zł"
            tryb: "za każde zaświadczenie"
          - usluga: "Potwierdzenie przelewu spłaty raty w formie papierowej"
            stawka: "5,00 zł"
            tryb: "za każde potwierdzenie"
          - usluga: "Wydruk zestawienia spłat za okres powyżej 12 miesięcy"
            stawka: "15,00 zł"
            tryb: "za każde zestawienie"
          - usluga: "Opinia bankowa o kliencie dla podmiotu zewnętrznego"
            stawka: "60,00 zł"
            tryb: "za każdą opinię"
          - usluga: "{Kopia|Odpis} dokumentów z teczki kredytowej"
            stawka: "1,00 zł za stronę, min. 10,00 zł"
            tryb: "za każdą kopię"
          - usluga: "Zmiana adresu {korespondencyjnego|do doręczeń} w umowie"
            stawka: "bez opłat"
            tryb: "za każdą zmianę"
          - usluga: "Przekazanie informacji o kredycie osobie upoważnionej przez Klienta"
            stawka: "20,00 zł"
            tryb: "za każde upoważnienie"
          - usluga: "Poświadczenie podpisu na dokumentach kredytowych w {placówce|oddziale}"
            stawka: "bez opłat"
            tryb: "za każdy dokument"
          - usluga: "Potwierdzenie przeniesienia wierzytelności (cesji) dla dłużnika"
            stawka: "100,00 zł"
            tryb: "jednorazowo"

  - id: taryfa-kredyty-gotowkowe-opc-3
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "Spłata kredytu w placówce Banku — wpłata gotówkowa na rachunek kredytowy"
            stawka: "{{fakt:oplata.wplata-gotowkowa}}"
            tryb: "za każdą wpłatę"
          - usluga: "Spłata raty przelewem z rachunku w innym banku"
            stawka: "według taryfy banku Klienta"
            tryb: "za każdy przelew"
          - usluga: "Spłata raty przelewem natychmiastowym"
            stawka: "{{fakt:oplata.przelew-natychmiastowy}}"
            tryb: "za każdy przelew"
          - usluga: "{Zlecenie stałe|Stałe zlecenie} spłaty raty z rachunku osobistego w Banku"
            stawka: "bez opłat"
            tryb: "za każde zlecenie"
          - usluga: "Spłata raty w punkcie partnerskim {Banku|współpracującym z Bankiem}"
            stawka: "4,00 zł"
            tryb: "za każdą wpłatę"
          - usluga: "Nadpłata raty ponad kwotę wymagalną — {zaliczenie|zarachowanie} na poczet kapitału"
            stawka: "bez opłat"
            tryb: "za każdą nadpłatę"
          - usluga: "Zwrot nadpłaconej kwoty na rachunek Klienta"
            stawka: "bez opłat"
            tryb: "za każdy zwrot"
          - usluga: "Zwrot nadpłaconej kwoty w gotówce w placówce"
            stawka: "0,5% min. 10,00 zł"
            tryb: "od kwoty zwrotu"
          - usluga: "Odwołanie nieudanego polecenia zapłaty z rachunku w innym banku"
            stawka: "10,00 zł"
            tryb: "za każde odwołanie"
          - usluga: "Ponowne {uruchomienie|aktywowanie} zlecenia stałego po {blokadzie|zajęciu} rachunku"
            stawka: "15,00 zł"
            tryb: "za każde uruchomienie"
          - usluga: "Poszukiwanie wpłaty niewłaściwie opisanej przez Klienta"
            stawka: "25,00 zł"
            tryb: "za każde poszukiwanie"

  - id: taryfa-kredyty-gotowkowe-opc-4
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "Kredyt gotówkowy {dla emerytów i rencistów|dla seniorów} — prowizja"
            stawka: "2,0% min. 80,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt gotówkowy dla {młodych|osób młodych} (do 26. roku życia) — prowizja"
            stawka: "1,5% min. 60,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt na cele {edukacyjne|naukowe i edukacyjne} — prowizja"
            stawka: "1,0% min. 50,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt na zakup lub montaż instalacji fotowoltaicznej — prowizja"
            stawka: "2,0% min. 100,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt na remont lub wyposażenie mieszkania — prowizja"
            stawka: "2,5% min. 100,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "Kredyt na zakup pojazdu — prowizja"
            stawka: "2,5% min. 100,00 zł"
            tryb: "od kwoty kredytu"
            podpozycje:
              - usluga: "pojazd nowy"
                stawka: "2,0%"
                tryb: "od kwoty kredytu"
              - usluga: "pojazd używany"
                stawka: "3,0%"
                tryb: "od kwoty kredytu"
          - usluga: "Kredyt z poręczeniem osoby trzeciej — opłata za sporządzenie umowy poręczenia"
            stawka: "100,00 zł"
            tryb: "za każde poręczenie"
          - usluga: "Kredyt z umowy o limit odnawialny w ofercie bankowości mobilnej"
            stawka: "1,0% min. 20,00 zł"
            tryb: "od kwoty kredytu"
          - usluga: "{Pożyczka krótkoterminowa|Pożyczka na krótki okres} do 90 dni — prowizja"
            stawka: "0,0% (promocja stała)"
            tryb: "od kwoty pożyczki"
          - usluga: "Pożyczka gotówkowa dla klientów korporacyjnych (pracowników zakładów współpracujących)"
            stawka: "1,0% min. 50,00 zł"
            tryb: "od kwoty pożyczki"

  - id: taryfa-kredyty-gotowkowe-opc-5
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "Zmiana liczby rat — {skrócenie|zmniejszenie} okresu kredytowania"
            stawka: "bez opłat"
            tryb: "za każdą zmianę"
          - usluga: "Zmiana rodzaju rat z równych na malejące"
            stawka: "60,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zmiana rodzaju rat z malejących na równe"
            stawka: "60,00 zł"
            tryb: "jednorazowo"
          - usluga: "Przeniesienie praw i obowiązków z umowy kredytu na inną osobę (przejęcie długu)"
            stawka: "1,0% salda min. 200,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zwolnienie jednego ze współkredytobiorców z długu"
            stawka: "150,00 zł"
            tryb: "jednorazowo"
          - usluga: "{Dodanie|Przystąpienie} współkredytobiorcy do umowy"
            stawka: "200,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zmiana waluty spłaty (dotyczy kredytów w walucie obcej)"
            stawka: "0,5% salda min. 100,00 zł"
            tryb: "jednorazowo"
          - usluga: "Wcześniejsza spłata — zmiana harmonogramu po częściowej nadpłacie"
            stawka: "bez opłat"
            tryb: "za każdą zmianę"
          - usluga: "Ponowne rozpatrzenie wniosku po {odmowie|odrzuceniu wniosku} (w ciągu 30 dni)"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Przygotowanie symulacji kosztów kredytu na wniosek Klienta"
            stawka: "bez opłat"
            tryb: "za każdą symulację"

  - id: taryfa-kredyty-gotowkowe-opc-6
    typy: [taryfy]
    tematy: [taryfa-kredyty]
    kategoria: pozycje-kredyty-gotowkowe
    wspolny: false
    elementy:
      - pozycje-taryfy:
          - usluga: "{Ustanowienie|Założenie} blokady środków na rachunku jako zabezpieczenia kredytu"
            stawka: "50,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zwolnienie blokady środków po spłacie kredytu"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Cesja praw z polisy ubezpieczeniowej na rzecz Banku"
            stawka: "60,00 zł"
            tryb: "jednorazowo"
          - usluga: "Zwolnienie cesji praw z polisy po spłacie kredytu"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Weryfikacja dokumentów dochodowych przedłożonych po terminie"
            stawka: "30,00 zł"
            tryb: "jednorazowo"
          - usluga: "Weryfikacja {zatrudnienia|stosunku pracy} u pracodawcy Klienta na wniosek Klienta"
            stawka: "bez opłat"
            tryb: "jednorazowo"
          - usluga: "Opłata za ponowne uruchomienie kredytu po wygaśnięciu terminu uruchomienia"
            stawka: "100,00 zł"
            tryb: "jednorazowo"
          - usluga: "Sporządzenie aneksu do umowy w formie {elektronicznej|dokumentowej}"
            stawka: "{{fakt:oplata.kredyt-gotowkowy.aneks}}, w tym 20,00 zł opłaty elektronicznej"
            tryb: "za każdy aneks"
          - usluga: "Wypłata kredytu na rachunek w innym banku w walucie obcej"
            stawka: "0,2% min. 20,00 zł, max 150,00 zł"
            tryb: "od kwoty wypłaty"
          - usluga: "Opłata za przeliczenie salda po kursie z Tabeli kursów walut"
            stawka: "marża {{fakt:kurs.marza-przeliczen}}"
            tryb: "od kwoty przeliczenia"
