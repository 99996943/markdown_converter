bloki:
  - id: procedura-aml-kyc-krok-id-4
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-identyfikacja
    elementy:
      - kroki:
          - tekst: "Zidentyfikuj klienta, który zawiera umowę wyłącznie przy użyciu środków komunikacji na odległość."
            podkroki:
              - tekst: "Poproś o przesłanie czytelnych obrazów obu stron dokumentu tożsamości oraz o wykonanie zdjęcia twarzy w czasie rzeczywistym, z zachowaniem warunków wskazanych w instrukcji kanału zdalnego."
              - tekst: "Porównaj dane z dokumentu z danymi podanymi we wniosku; {każdą|wszelką} rozbieżność w pisowni nazwiska, numerze dokumentu lub dacie urodzenia wyjaśnij przed dalszym procedowaniem."
              - tekst: "Gdy jakość obrazu uniemożliwia ocenę zabezpieczeń dokumentu, nie podejmuj decyzji; poproś o ponowne przesłanie albo skieruj klienta do {oddziału|placówki}."
          - tekst: "Zweryfikuj tożsamość za pomocą dodatkowego, niezależnego źródła."
            podkroki:
              - tekst: "Wykonaj przelew weryfikacyjny z rachunku klienta prowadzonego w innej instytucji kredytowej i porównaj dane właściciela rachunku z danymi wnioskodawcy."
              - tekst: "Jeżeli dane nie są zgodne, zakończ proces bez zawierania umowy i zapisz przyczynę w karcie klienta ({{fakt:aml.system-klienci}})."
          - tekst: "Oceń, czy zdalny sposób nawiązania relacji podnosi ryzyko."
            podkroki:
              - tekst: "Zwróć uwagę na wzorce zachowań wskazujące na działanie osoby trzeciej: wielokrotne wnioski z tego samego urządzenia, dane kontaktowe zgodne z innymi klientami, pośpiech w uruchomieniu usług."
              - tekst: "Gdy w toku weryfikacji pojawi się choć jeden z takich sygnałów, podnieś ocenę ryzyka o jeden poziom i opisz powód w karcie klienta."
          - tekst: "Zakończ czynności i zachowaj ślad weryfikacji."
            podkroki:
              - tekst: "Do karty klienta dołącz obrazy dokumentu, zdjęcie z weryfikacji, wynik przelewu weryfikacyjnego oraz datę i godzinę każdej czynności."
              - tekst: "Relację uruchamia się dopiero po zatwierdzeniu przez drugą osobę, jeżeli wynik scoringu jest wyższy niż niski."

  - id: procedura-aml-kyc-krok-id-5
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-identyfikacja
    elementy:
      - kroki:
          - tekst: "Zidentyfikuj klienta będącego cudzoziemcem."
            podkroki:
              - tekst: "Przyjmij paszport lub inny dokument podróży z ważnością obejmującą dzień czynności; kartę pobytu lub inny dokument potwierdzający prawo pobytu zachowaj jako dokument uzupełniający."
              - tekst: "Imiona i nazwisko wpisz w brzmieniu zapisanym w strefie odczytu maszynowego dokumentu, bez tłumaczenia i bez zmiany znaków diakrytycznych."
              - tekst: "Jeżeli dokument jest sporządzony w alfabecie innym niż łaciński, sporządź zapis transliterowany i oznacz go jako opracowany przez pracownika."
          - tekst: "Ustal adres i cel pobytu klienta."
            podkroki:
              - tekst: "Zapytaj o adres zamieszkania w Polsce i w państwie pochodzenia; adres w Polsce potwierdź dokumentem lub oświadczeniem klienta."
              - tekst: "Zapisz, czy klient pracuje, uczy się, prowadzi działalność czy przebywa w Polsce czasowo, ponieważ od tego zależą przewidywane obroty na rachunku."
          - tekst: "Sprawdź ograniczenia wynikające z długości pobytu."
            podkroki:
              - tekst: "Gdy dokument pobytowy wygasa w ciągu {kolejnych|najbliższych} sześciu miesięcy, ustaw w {{fakt:aml.system-klienci}} przypomnienie o jego aktualizacji."
              - tekst: "Po upływie ważności dokumentu nie realizuj dyspozycji, które powiększają zobowiązania lub ekspozycję Banku, do czasu przedstawienia nowego dokumentu."
          - tekst: "Uwzględnij państwo pochodzenia w ocenie ryzyka."
            podkroki:
              - tekst: "Porównaj obywatelstwo i państwo zamieszkania z dokumentem „{{fakt:aml.wykaz-krajow}}”; wynik wpisz do formularza oceny ryzyka."
              - tekst: "Sam fakt cudzoziemskiego pochodzenia nie jest przesłanką odmowy ani podniesienia ryzyka; ocenia się wyłącznie okoliczności wskazane w wykazie i w scoringu."

  - id: procedura-aml-kyc-krok-id-6
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-identyfikacja
    elementy:
      - kroki:
          - tekst: "Zidentyfikuj osobę małoletnią lub ubezwłasnowolnioną częściowo."
            podkroki:
              - tekst: "Zidentyfikuj najpierw przedstawiciela ustawowego i zweryfikuj jego tożsamość na zasadach ogólnych; następnie odnotuj dane małoletniego na podstawie aktu urodzenia lub dokumentu tożsamości."
              - tekst: "Zażądaj dokumentu potwierdzającego umocowanie przedstawiciela, na przykład aktu urodzenia, orzeczenia sądu lub postanowienia o ustanowieniu opiekuna."
          - tekst: "Sprawdź, czy zgoda sądu opiekuńczego jest wymagana."
            podkroki:
              - tekst: "Przy czynnościach przekraczających zwykły zarząd {zażądaj|poproś o} odpis postanowienia sądu; w razie jego braku odmów wykonania czynności."
              - tekst: "O odmowie poinformuj przedstawiciela ustawowego ustnie i, na jego żądanie, na piśmie, wskazując brakujący dokument."
          - tekst: "Ustal źródło środków wpłacanych na rachunek małoletniego."
            podkroki:
              - tekst: "Gdy jednorazowa wpłata przekracza {{fakt:aml.prog-wplata-udokumentowanie}}, zażądaj dokumentu potwierdzającego pochodzenie środków, na przykład umowy darowizny lub dokumentu dotyczącego spadku."
              - tekst: "Wpłaty regularne w niewielkich kwotach, pochodzące od rodziców lub dziadków, nie wymagają odrębnych dokumentów, jeżeli nie wzbudzają wątpliwości."
          - tekst: "Zaplanuj aktualizację po osiągnięciu pełnoletności."
            podkroki:
              - tekst: "W {{fakt:aml.system-klienci}} ustaw przypomnienie na miesiąc przed osiemnastymi urodzinami klienta."
              - tekst: "Po osiągnięciu pełnoletności zidentyfikuj klienta ponownie, już jako samodzielną stronę stosunków, i zastosuj zasady oceny ryzyka jak dla innych klientów."

  - id: procedura-aml-kyc-krok-benef-4
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-beneficjent
    elementy:
      - kroki:
          - tekst: "Ustal beneficjenta rzeczywistego spółki z kilkoma poziomami struktury właścicielskiej."
            podkroki:
              - tekst: "Poproś przedstawiciela klienta o schemat struktury, w którym wskazano wszystkie podmioty pośredniczące, ich udziały procentowe i kraje rejestracji."
              - tekst: "Przelicz udziały pośrednie przez mnożenie wartości na kolejnych poziomach; osobę, której łączny udział przekracza {{fakt:aml.prog-udzialu-beneficjenta}}, wpisz jako beneficjenta rzeczywistego."
              - tekst: "Wynik obliczeń zapisz w karcie klienta wraz z datą i imieniem osoby, która go sporządziła."
          - tekst: "Zweryfikuj dane beneficjenta w niezależnych źródłach."
            podkroki:
              - tekst: "Porównaj oświadczenie klienta z danymi z Centralnego Rejestru Beneficjentów Rzeczywistych oraz z odpisem z właściwego rejestru przedsiębiorców."
              - tekst: "Wykryte rozbieżności zgłoś klientowi i {poproś|zażądaj}, aby w terminie {{fakt:termin.aml.uzupelnienie-dokumentow}} wyjaśnił je lub zaktualizował wpis."
              - tekst: "O rozbieżności, której klient nie usunął w terminie, poinformuj komórkę zgodności ({{fakt:jednostka.zgodnosc}}); informacja ta może uzasadniać zgłoszenie zgodnie z przepisami."
          - tekst: "Gdy żadna osoba nie spełnia kryterium udziału, ustal beneficjenta według kryterium kontroli."
            podkroki:
              - tekst: "Zbadaj, kto faktycznie sprawuje kontrolę: powołuje zarząd, ma prawo weta, dysponuje większością głosów na mocy porozumień albo wywiera decydujący wpływ w inny sposób."
              - tekst: "Jeżeli nikt nie spełnia również tego kryterium, jako beneficjenta wpisz członka organu zarządzającego z najwyższym uprawnieniem i odnotuj, że przyjęto rozwiązanie zastępcze."
          - tekst: "Zapewnij aktualność danych."
            podkroki:
              - tekst: "Poproś klienta o niezwłoczne informowanie o każdej zmianie wśród wspólników, akcjonariuszy lub osób kontrolujących."
              - tekst: "Przy każdym przeglądzie okresowym ponownie sprawdź dane beneficjenta w rejestrze i potwierdź ich zgodność."

  - id: procedura-aml-kyc-krok-benef-5
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-beneficjent
    elementy:
      - kroki:
          - tekst: "Ustal beneficjenta rzeczywistego fundacji, stowarzyszenia i innych podmiotów bez właścicieli."
            podkroki:
              - tekst: "Zażądaj statutu, odpisu z rejestru oraz uchwał dotyczących powołania członków zarządu i organu nadzoru."
              - tekst: "Jako beneficjentów wpisz fundatora, osoby powołane do organów oraz osoby, na rzecz których działa podmiot, jeżeli statut lub inne dokumenty je wskazują."
          - tekst: "Ustal beneficjentów trustu lub podobnej konstrukcji prawnej."
            podkroki:
              - tekst: "Poproś o akt założycielski, dane powiernika, protektora, jeżeli został ustanowiony, oraz beneficjentów lub opis klasy osób, na rzecz których działa konstrukcja."
              - tekst: "Relację z takim klientem {kieruj|przekaż} do zatwierdzenia przez kierownika jednostki zgodności, ponieważ wiąże się ona z podwyższonym ryzykiem."
          - tekst: "Wyjaśnij cel i charakter stosunków gospodarczych."
            podkroki:
              - tekst: "Zapytaj o przewidywane źródła przychodów podmiotu, główne rodzaje transakcji, spodziewane obroty miesięczne i państwa kontrahentów."
              - tekst: "Odpowiedzi zapisz w kwestionariuszu w {{fakt:aml.system-klienci}}; stanowią one punkt odniesienia dla późniejszego monitorowania transakcji."
          - tekst: "Zweryfikuj osoby uprawnione do składania dyspozycji."
            podkroki:
              - tekst: "Każdą osobę umocowaną do reprezentacji zidentyfikuj i zweryfikuj na zasadach ogólnych oraz zapisz zakres jej uprawnień i datę ich wygaśnięcia."
              - tekst: "Dyspozycje składane przez osoby, których umocowania nie zweryfikowano, zawieś do czasu uzupełnienia dokumentów."

  - id: procedura-aml-kyc-krok-ryzyko-4
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-ryzyko
    elementy:
      - kroki:
          - tekst: "Oceń ryzyko związane z rodzajem działalności klienta będącego przedsiębiorcą."
            podkroki:
              - tekst: "Sprawdź przeważający rodzaj działalności według klasyfikacji w rejestrze; branże intensywnie korzystające z gotówki, handlu antykami, obrotu nieruchomościami lub usług wymiany walut {zakwalifikuj|ujmij} do podwyższonej kategorii ryzyka."
              - tekst: "Dla działalności wymagającej zezwolenia lub wpisu do rejestru żądaj kopii tego zezwolenia i sprawdzaj jego ważność przy przeglądzie okresowym."
          - tekst: "Oceń ryzyko geograficzne."
            podkroki:
              - tekst: "Uwzględnij państwo siedziby klienta, państwa kontrahentów oraz państwa, do których kierowane są płatności, porównując je z dokumentem „{{fakt:aml.wykaz-krajow}}”."
              - tekst: "Za każde powiązanie z państwem z wykazu doliczaj punkty zgodnie z załącznikiem dotyczącym scoringu; samo powiązanie nie przesądza o odmowie."
          - tekst: "Oceń ryzyko związane z produktem i kanałem."
            podkroki:
              - tekst: "Produkty umożliwiające szybkie przemieszczanie środków, takie jak przelewy natychmiastowe lub wypłaty gotówki w wielu miejscach, oceniaj wyżej niż rachunki oszczędnościowe."
              - tekst: "Relacje nawiązane zdalnie lub przez pośrednika oceniaj z uwzględnieniem rzetelności tego pośrednika i jakości przeprowadzonej przez niego identyfikacji."
          - tekst: "Zsumuj wyniki i przypisz klienta do kategorii."
            podkroki:
              - tekst: "Klientów, których wynik osiąga {{fakt:aml.wynik-wysokie-ryzyko}} punktów lub więcej, zaliczaj do wysokiego ryzyka; klientów z wynikiem do {{fakt:aml.wynik-niskie-ryzyko}} punktów — do niskiego."
              - tekst: "Zmiany kategorii dokonuj wyłącznie na podstawie udokumentowanej przyczyny; ręczne obniżenie wyniku wymaga zgody kierownika jednostki zgodności."

  - id: procedura-aml-kyc-krok-ryzyko-5
    typy: [procedury]
    tematy: [procedura-aml-kyc]
    kategoria: aml-krok-ryzyko
    elementy:
      - kroki:
          - tekst: "Przeprowadź przegląd okresowy relacji z klientem."
            podkroki:
              - tekst: "Terminy przeglądów wynoszą: dla wysokiego ryzyka — {{fakt:termin.aml.przeglad-wysokie}}, dla średniego — {{fakt:termin.aml.przeglad-srednie}}, dla niskiego — {{fakt:termin.aml.przeglad-niskie}}."
              - tekst: "Przy przeglądzie sprawdź aktualność dokumentu tożsamości, danych kontaktowych, beneficjenta rzeczywistego oraz zgodność obrotów z deklarowanym celem relacji."
          - tekst: "Przeprowadź przegląd poza terminem, gdy wystąpi zdarzenie wyzwalające."
            podkroki:
              - tekst: "Zdarzeniem wyzwalającym jest w szczególności zmiana beneficjenta, wniosek o zwiększenie limitów, pojawienie się klienta w publikacjach medialnych dotyczących przestępstw oraz zgłoszenie analizy transakcji."
              - tekst: "Przegląd taki rozpocznij nie później niż w terminie {{fakt:termin.aml.analiza-alertu}} od dnia powzięcia informacji o zdarzeniu."
          - tekst: "Udokumentuj wynik przeglądu."
            podkroki:
              - tekst: "W formularzu przeglądu wpisz wnioski, zmianę kategorii ryzyka, jeżeli nastąpiła, oraz datę kolejnego przeglądu."
              - tekst: "Formularz zatwierdza osoba inna niż ta, która przegląd przeprowadziła, jeżeli kategoria ryzyka klienta jest wysoka."
          - tekst: "Zareaguj na brak współpracy klienta."
            podkroki:
              - tekst: "Jeżeli klient nie przekaże żądanych informacji w wyznaczonym terminie, wstrzymaj realizację nowych produktów i poinformuj go o skutkach takiego braku."
              - tekst: "Po bezskutecznym upływie ponownie wyznaczonego terminu przekaż sprawę do komórki zgodności w celu podjęcia decyzji o zakończeniu relacji."
