    elementy:
      - ustep: "Jeżeli którekolwiek z postanowień Regulaminu zostanie uznane przez sąd lub inny uprawniony organ za nieważne lub niewiążące, pozostałe postanowienia pozostają w mocy. W miejsce postanowienia nieważnego stosuje się odpowiedni przepis prawa, a jeżeli takiego brak — postanowienie najbardziej zbliżone do zamiaru stron, o ile nie narusza ono praw konsumenta."
