      - ustep: "Zrzeczenie się przez Bank wykonywania któregokolwiek uprawnienia wynikającego z Regulaminu w jednym przypadku nie oznacza zrzeczenia się go w innych przypadkach. Załączniki i aneksy do Regulaminu stanowią jego integralną część."
