bloki:
  # ===== Rozdział: Postanowienia ogólne =====
  - id: bankowosc-elektroniczna-zakres
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Regulamin {określa|reguluje} zasady korzystania z {bankowości elektronicznej|usług bankowości elektronicznej} oraz z aplikacji mobilnej „{{fakt:bankowosc.nazwa-aplikacji}}” udostępnianych przez {{param:bank}} (zwany dalej „Bankiem”) {klientom indywidualnym|osobom fizycznym niebędącym przedsiębiorcami}, a także prawa i obowiązki stron w tym zakresie."
      - ustep: "Bankowość elektroniczna umożliwia Klientowi {w szczególności|między innymi} dostęp do informacji o produktach, składanie dyspozycji dotyczących rachunku płatniczego, zawieranie umów na odległość oraz kontakt z Bankiem, z zachowaniem wymogów bezpieczeństwa opisanych w Regulaminie.[^1]"
      - ustep: "W sprawach nieuregulowanych w Regulaminie {stosuje się|mają zastosowanie} postanowienia umowy rachunku lub innego produktu, którego dotyczy dyspozycja, oraz przepisy prawa, w tym {{ref:akt:dz-u-2024-30-uslugi-platnicze}}."
      - ustep: "Regulamin jest {udostępniany|przekazywany} Klientowi przed zawarciem umowy o korzystanie z bankowości elektronicznej na trwałym nośniku, w placówkach Banku oraz na stronie {{fakt:bank.strona}}. Klient {może|ma prawo} w każdym czasie zażądać jego bezpłatnego odpisu."
    przypisy:
      1: "Szczegółowy zakres funkcji dostępnych w poszczególnych kanałach {Bank podaje|jest podawany} na stronie {{fakt:bankowosc.adres-serwisu}} i w aplikacji mobilnej; Bank {może go|może ten zakres} rozszerzać bez zmiany Regulaminu."

  - id: bankowosc-elektroniczna-definicje
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Ponadto, na potrzeby stosowania Regulaminu, {użyte w nim określenia|poszczególne określenia} oznaczają:"
        punkty:
          - "**Serwis internetowy** — strona bankowości elektronicznej dostępna pod adresem {{fakt:bankowosc.adres-serwisu}}, do której logowanie odbywa się za pomocą przeglądarki internetowej;"
          - "**Aplikacja mobilna** — oprogramowanie „{{fakt:bankowosc.nazwa-aplikacji}}” instalowane na urządzeniu mobilnym Klienta, pobierane {wyłącznie z oficjalnych|jedynie z oficjalnych} sklepów z aplikacjami dla danego systemu operacyjnego;"
          - "**Identyfikator** — ciąg znaków nadany Klientowi przez Bank, służący do jego identyfikacji podczas logowania;"
          - "**Hasło** — poufny ciąg znaków ustalony przez Klienta, stanowiący element wiedzy w procesie uwierzytelniania;"
          - "**Urządzenie zaufane** — urządzenie mobilne Klienta, które zostało powiązane z jego profilem w bankowości elektronicznej i może służyć do potwierdzania dyspozycji;"
          - "**Kod jednorazowy** — kod {generowany|przesyłany} przez Bank lub aplikację mobilną, ważny dla jednej operacji i przez ograniczony czas;"
          - "**Silne uwierzytelnianie** — uwierzytelnianie oparte na co najmniej dwóch niezależnych elementach należących do kategorii wiedzy, posiadania i cechy użytkownika;"
          - "**Autoryzacja** — wyrażenie zgody na wykonanie dyspozycji w sposób określony w Regulaminie;"
          - "**Sesja** — okres nieprzerwanego korzystania z bankowości elektronicznej po zalogowaniu, kończący się wylogowaniem albo automatycznie po okresie bezczynności;"
          - "**Biometria** — {cecha|cechy} użytkownika, takie jak odcisk palca lub obraz twarzy, wykorzystywane przez system operacyjny urządzenia do weryfikacji jego właściciela;"
          - "**Nowy odbiorca** — odbiorca przelewu, którego rachunek nie został dotąd zapisany na liście zaufanych odbiorców Klienta."

  - id: bankowosc-elektroniczna-umowa
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Umowa o korzystanie z bankowości elektronicznej {zostaje zawarta|jest zawierana} z Klientem, który posiada w Banku rachunek płatniczy i zakończył proces identyfikacji zgodnie z przepisami o przeciwdziałaniu praniu pieniędzy. Umowę można zawrzeć:"
        punkty:
          - "w placówce Banku, przez podpisanie wniosku {w formie papierowej|na formularzu udostępnionym przez pracownika};"
          - "w trakcie zawierania umowy rachunku, jako jeden z elementów tej umowy;"
          - "na odległość, za pośrednictwem {strony internetowej Banku|Infolinii}, po pozytywnej weryfikacji tożsamości Klienta."
      - ustep: "Umowa {zawierana jest|jest zawierana} na czas nieokreślony. Wygaśnięcie lub rozwiązanie umowy rachunku powoduje {jednoczesne|równoczesne} wygaśnięcie umowy o korzystanie z bankowości elektronicznej w zakresie tego rachunku.[^1]"
      - ustep: "Klient {może|ma prawo} odstąpić od umowy zawartej na odległość bez podania przyczyny w terminie {{fakt:termin.odstapienie-od-umowy}} od dnia jej zawarcia, składając Bankowi oświadczenie na trwałym nośniku albo w bankowości elektronicznej."
    przypisy:
      1: "W przypadku rachunku wspólnego umowa o korzystanie z bankowości elektronicznej {jest zawierana|może zostać zawarta} z każdym ze współposiadaczy odrębnie, a rozwiązanie jej przez jednego z nich nie wpływa na dostęp pozostałych."

  # ===== Rozdział: Dostęp i aktywacja =====
  - id: bankowosc-elektroniczna-dostep
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Dostęp do bankowości elektronicznej {mają|uzyskują} Klienci, którzy ukończyli 13 lat i posiadają w Banku rachunek płatniczy. Zakres uprawnień Klienta niepełnoletniego lub o ograniczonej zdolności do czynności prawnych {ustala|określa} Bank w zależności od wieku i zgody przedstawiciela ustawowego."
      - ustep: "Bank nadaje Klientowi Identyfikator, który {przekazuje|udostępnia} w placówce, na Infolinii po weryfikacji tożsamości albo w wiadomości elektronicznej wysłanej na adres e-mail wskazany we wniosku. Identyfikator nie jest informacją poufną, lecz jego ujawnienie osobom trzecim {nie jest zalecane|powinno być ograniczone}."
      - ustep: "Dostęp do bankowości elektronicznej jest możliwy:"
        punkty:
          - "za pośrednictwem serwisu internetowego, po zalogowaniu za pomocą Identyfikatora i Hasła oraz — w przypadkach wskazanych w Regulaminie — dodatkowego elementu uwierzytelniającego;"
          - "za pośrednictwem aplikacji mobilnej, po aktywacji urządzenia zaufanego;"
          - "w ograniczonym zakresie przez Infolinię, jeżeli Klient został zweryfikowany zgodnie z procedurą Banku."

  - id: bankowosc-elektroniczna-aktywacja
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Aktywacja dostępu do bankowości elektronicznej {wymaga|polega na} wykonaniu następujących czynności:"
        punkty:
          - "pierwszym zalogowaniu za pomocą Identyfikatora i Hasła tymczasowego przekazanego przez Bank;"
          - "ustaleniu własnego Hasła, które spełnia wymogi określone w Regulaminie;"
          - tekst: "potwierdzeniu numeru telefonu komórkowego, przy czym:"
            litery:
              - "kod potwierdzający jest ważny {{fakt:bankowosc.waznosc-kodu-sms}};"
              - "numer telefonu musi być zgodny z numerem zapisanym w danych Klienta w Banku;"
              - "zmiana numeru wymaga ponownej weryfikacji tożsamości Klienta."
      - ustep: "Hasło tymczasowe i kod aktywacyjny do aplikacji mobilnej {są ważne|zachowują ważność} przez {{fakt:bankowosc.waznosc-kodu-aktywacyjnego}} od dnia ich przekazania. Po upływie tego terminu {należy|Klient powinien} zamówić nowy kod w placówce, na Infolinii lub w serwisie internetowym; wydanie nowego kodu aktywacyjnego jest {czynnością|usługą} opłacaną zgodnie z {{ref:dokument:taryfa-bankowosc-elektroniczna}}.[^1]"
      - ustep: "Bank może odmówić aktywacji dostępu, jeżeli dane Klienta nie zostały zweryfikowane albo zachodzi podejrzenie, że dostęp miałby zostać wykorzystany niezgodnie z prawem."
    przypisy:
      1: "Aktualna opłata za wydanie nowego kodu aktywacyjnego wynosi {{fakt:oplata.bankowosc.nowy-kod-aktywacyjny}}; pierwszy kod aktywacyjny wydawany jest {bez opłat|nieodpłatnie}."

  # ===== Rozdział: Wymagania techniczne =====
  - id: bankowosc-elektroniczna-wymagania
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Korzystanie z bankowości elektronicznej {wymaga|jest możliwe pod warunkiem} posiadania przez Klienta:"
        punkty:
          - "urządzenia z dostępem do Internetu, w tym komputera lub urządzenia mobilnego;"
          - "przeglądarki internetowej w jednej z dwóch ostatnich głównych wersji, z włączoną obsługą szyfrowania i plików cookies;"
          - "aktywnego adresu e-mail oraz numeru telefonu komórkowego umożliwiającego odbiór wiadomości SMS;"
          - "w przypadku aplikacji mobilnej — urządzenia z systemem operacyjnym w wersji objętej wsparciem producenta oraz z aktualnymi poprawkami bezpieczeństwa."
      - ustep: "Aplikacja mobilna {może być|jest} instalowana wyłącznie z oficjalnych sklepów z aplikacjami. Bank {nie zapewnia|nie gwarantuje} działania aplikacji na urządzeniach, w których zmodyfikowano system operacyjny w sposób znoszący jego zabezpieczenia."
      - ustep: "Koszty połączenia z Internetem i transmisji danych ponosi Klient zgodnie z umową zawartą z operatorem. Wymagania techniczne mogą ulegać zmianie; o ich zmianie Bank {informuje|powiadamia} Klienta w serwisie internetowym i w aplikacji mobilnej z odpowiednim wyprzedzeniem."

  # ===== Rozdział: Uwierzytelnianie =====
  - id: bankowosc-elektroniczna-uwierzytelnianie
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Logowanie do bankowości elektronicznej {odbywa się|wymaga uwierzytelnienia} przez podanie Identyfikatora i Hasła. Hasło powinno {mieć co najmniej|składać się z co najmniej} {{fakt:bankowosc.min-dlugosc-hasla}} i zawierać litery, cyfry oraz znaki specjalne."
      - ustep: "Po {{fakt:bankowosc.limit-prob}} logowania dostęp zostaje {zablokowany|czasowo zablokowany}. Odblokowanie następuje po weryfikacji tożsamości Klienta na Infolinii, w placówce lub w procesie samoobsługowym w aplikacji mobilnej."
      - ustep: "Po zalogowaniu sesja jest automatycznie kończona po {{fakt:bankowosc.timeout-sesji}} bezczynności. Wznowienie pracy wymaga ponownego zalogowania."
      - ustep: "Bank nigdy nie prosi Klienta o podanie pełnego Hasła ani o przekazanie kodu jednorazowego w rozmowie telefonicznej, w wiadomości e-mail lub SMS. {Każda taka prośba|Prośba o udostępnienie tych danych} powinna być traktowana jako próba oszustwa."

  - id: bankowosc-elektroniczna-silne-uwierzytelnianie
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank stosuje silne uwierzytelnianie, gdy Klient:"
        punkty:
          - "uzyskuje dostęp do rachunku płatniczego online po raz pierwszy lub po upływie {{fakt:bankowosc.ponowne-sca}} od ostatniego silnego uwierzytelnienia;"
          - "składa zlecenie płatnicze, w tym przelew;"
          - tekst: "wykonuje czynność za pośrednictwem kanału zdalnego, która może wiązać się z ryzykiem oszustwa, w szczególności:"
            litery:
              - "dodaje odbiorcę do listy zaufanych;"
              - "zmienia dane kontaktowe, Hasło lub limity;"
              - "dodaje lub usuwa urządzenie zaufane."
      - ustep: "Silne uwierzytelnianie opiera się na co najmniej dwóch z trzech elementów: wiedzy (Hasło lub kod PIN aplikacji), posiadania (urządzenie zaufane lub kod SMS) i cechy użytkownika (biometria). Elementy te są od siebie niezależne w taki sposób, że naruszenie jednego nie osłabia wiarygodności pozostałych."
      - ustep: "Bank może zwolnić dyspozycję z silnego uwierzytelniania w przypadkach dopuszczonych przepisami, w szczególności dla płatności niskokwotowych do wysokości {{fakt:limit.bankowosc.platnosc-niskokwotowa}} lub przelewów na rachunki z listy zaufanych odbiorców.[^1] Bank {zastrzega|może zastrzec} sobie prawo żądania silnego uwierzytelnienia także w tych przypadkach."
    przypisy:
      1: "Zasady silnego uwierzytelniania i jego wyłączeń wynikają z {{ref:akt:dz-u-2024-30-uslugi-platnicze}} oraz przepisów wykonawczych Unii Europejskiej; Bank ocenia ryzyko każdej operacji indywidualnie."

  # ===== Rozdział: Aplikacja mobilna =====
  - id: bankowosc-elektroniczna-aplikacja
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Aplikacja mobilna jest udostępniana nieodpłatnie i {pozwala|umożliwia} Klientowi korzystanie z funkcji bankowości elektronicznej na urządzeniu mobilnym, w tym podgląd salda i historii operacji, wykonywanie przelewów, zarządzanie kartami oraz potwierdzanie dyspozycji."
      - ustep: "Aktywacja aplikacji mobilnej {obejmuje|polega na}:"
        punkty:
          - "pobraniu aplikacji z oficjalnego sklepu z aplikacjami;"
          - "wprowadzeniu kodu aktywacyjnego otrzymanego od Banku;"
          - "ustaleniu kodu PIN aplikacji, który służy do logowania i autoryzacji;"
          - "opcjonalnym włączeniu biometrii jako dodatkowego sposobu odblokowania aplikacji."
      - ustep: "Kod PIN aplikacji jest przechowywany wyłącznie na urządzeniu Klienta w postaci zaszyfrowanej. Bank {nie ma|nie posiada} dostępu do kodu PIN ani do danych biometrycznych Klienta, które są przetwarzane przez system operacyjny urządzenia."

  - id: bankowosc-elektroniczna-urzadzenia-zaufane
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Urządzeniem zaufanym {jest|staje się} urządzenie mobilne, na którym Klient aktywował aplikację mobilną i które zostało zarejestrowane w systemie Banku. Klient może powiązać ze swoim profilem nie więcej niż {{fakt:bankowosc.liczba-urzadzen}} urządzeń zaufanych jednocześnie."
      - ustep: "Zarządzanie listą urządzeń zaufanych jest możliwe w aplikacji mobilnej i w serwisie internetowym. Dodanie nowego urządzenia wymaga silnego uwierzytelnienia na dotychczasowym urządzeniu zaufanym, a w razie jego braku — weryfikacji w placówce Banku albo na Infolinii.[^1]"
      - ustep: "Klient jest obowiązany niezwłocznie usunąć urządzenie z listy zaufanych, jeżeli:"
        punkty:
          - "urządzenie zostało utracone, skradzione lub zbyte;"
          - "istnieje podejrzenie, że niepowołana osoba uzyskała do niego dostęp;"
          - "urządzenie nie jest już używane w celu korzystania z bankowości elektronicznej."
    przypisy:
      1: "Informacja o dodaniu nowego urządzenia zaufanego jest zawsze przekazywana {Klientowi|Klientowi niezwłocznie} w formie powiadomienia na pozostałe urządzenia oraz wiadomością SMS."

  # ===== Rozdział: Dyspozycje i limity =====
  - id: bankowosc-elektroniczna-dyspozycje
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Za pośrednictwem bankowości elektronicznej Klient {może|ma możliwość} składać dyspozycje, w szczególności:"
        punkty:
          - "przelewy krajowe w złotych, w tym przelewy natychmiastowe oraz zlecenia stałe;"
          - "przelewy między rachunkami własnymi;"
          - "dyspozycje dotyczące kart płatniczych, w tym zmianę limitów, zastrzeżenie karty i czasowe zablokowanie;"
          - "otwieranie i zamykanie lokat oraz rachunków oszczędnościowych;"
          - "złożenie wniosków o produkty Banku."
      - ustep: "Dyspozycja jest uznawana za złożoną w momencie jej autoryzacji przez Klienta. Dyspozycje przekazane do godziny granicznej określonej w umowie rachunku, w dniu roboczym, są realizowane {w tym samym dniu|tego samego dnia}; dyspozycje złożone po tej godzinie albo w dniu wolnym od pracy są realizowane w następnym dniu roboczym."
      - ustep: "Bank {może|ma prawo} odmówić wykonania dyspozycji, jeżeli jest ona niezgodna z prawem lub Regulaminem, brak jest wystarczających środków, rachunek jest zablokowany albo istnieje uzasadnione podejrzenie nadużycia. Bank {informuje|powiadamia} Klienta o odmowie i, jeśli to możliwe, o jej przyczynach."

  - id: bankowosc-elektroniczna-limity
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Dyspozycje składane w bankowości elektronicznej podlegają limitom kwotowym. {Domyślne limity|Limity ustawione przez Bank w dniu aktywacji dostępu} wynoszą:"
      - tabela:
          kolumny:
            - naglowek: "Rodzaj dyspozycji"
              waga: 3
            - naglowek: "Limit"
              waga: 2
          wiersze:
            - ["Przelewy — limit dzienny łącznie", "{{fakt:limit.przelew-dzienny-domyslny}}"]
            - ["Przelew jednorazowy w serwisie internetowym", "{{fakt:limit.bankowosc.przelew-jednorazowy}}"]
            - ["Przelew jednorazowy w aplikacji mobilnej", "{{fakt:limit.bankowosc.przelew-mobilny}}"]
            - ["Przelew natychmiastowy", "{{fakt:limit.rachunek-osobisty.przelew-natychmiastowy}}"]
            - ["Przelew do nowego odbiorcy", "{{fakt:limit.bankowosc.nowy-odbiorca}}"]
            - ["Płatności mobilne — limit dzienny", "{{fakt:limit.platnosci-mobilne.dzienny}}"]
          siatka: true
      - ustep: "Klient {może zmienić|ma możliwość zmiany} limity w granicach od {{fakt:limit.bankowosc.minimalny-ustawiany}} do {{fakt:limit.bankowosc.maksymalny-ustawiany}}. Zwiększenie limitu wymaga silnego uwierzytelnienia i może zostać poddane ocenie ryzyka przez Bank; zmiana limitu w placówce jest czynnością opłacaną zgodnie z {{ref:dokument:taryfa-bankowosc-elektroniczna}}.[^1]"
      - ustep: "Bank {może|ma prawo} czasowo obniżyć limity ze względów bezpieczeństwa, w szczególności w razie podejrzenia nieuprawnionego dostępu. O obniżeniu limitów Bank informuje Klienta niezwłocznie, o ile nie stoją temu na przeszkodzie względy bezpieczeństwa."
    przypisy:
      1: "Opłata za zmianę limitu w placówce wynosi {{fakt:oplata.bankowosc.zmiana-limitu-placowka}}; zmiana limitu w bankowości elektronicznej nie podlega opłacie."

  # ===== Rozdział: Powiadomienia =====
  - id: bankowosc-elektroniczna-powiadomienia
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {informuje|powiadamia} Klienta o istotnych zdarzeniach związanych z korzystaniem z bankowości elektronicznej za pomocą komunikatów w serwisie internetowym, powiadomień w aplikacji mobilnej (powiadomienia push), wiadomości SMS lub e-mail."
      - ustep: "Do zdarzeń, o których Bank powiadamia obligatoryjnie, należą:"
        punkty:
          - "logowanie z nowego urządzenia lub z nietypowej lokalizacji;"
          - "dodanie lub usunięcie urządzenia zaufanego;"
          - "zmiana Hasła, danych kontaktowych lub limitów;"
          - "zablokowanie lub odblokowanie dostępu."
      - ustep: "Powiadomienia o charakterze bezpieczeństwa są wysyłane bezpłatnie. Wiadomości SMS o transakcjach na rachunku są usługą dodatkową, opłacaną w wysokości {{fakt:oplata.powiadomienie-sms}} za wiadomość; kody jednorazowe SMS służące do uwierzytelnienia są bezpłatne ({{fakt:oplata.bankowosc.sms-kod}})."
      - ustep: "Klient jest zobowiązany {na bieżąco|regularnie} zapoznawać się z powiadomieniami oraz niezwłocznie zawiadamiać Bank o każdym powiadomieniu dotyczącym operacji, której nie wykonał."

  # ===== Rozdział: Bezpieczeństwo i obowiązki Klienta =====
  - id: bankowosc-elektroniczna-obowiazki
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Klient jest zobowiązany do korzystania z bankowości elektronicznej zgodnie z Regulaminem, a w szczególności do:"
        punkty:
          - "zachowania w tajemnicy Hasła, kodu PIN aplikacji i kodów jednorazowych oraz nieudostępniania ich osobom trzecim;"
          - "niezapisywania danych uwierzytelniających w sposób umożliwiający ich odczyt przez inne osoby;"
          - "ochrony urządzeń, z których korzysta, przed nieuprawnionym dostępem, w tym stosowania blokady ekranu;"
          - tekst: "stosowania aktualnego oprogramowania zabezpieczającego, w szczególności:"
            litery:
              - "instalowania aktualizacji systemu operacyjnego i aplikacji;"
              - "korzystania z oprogramowania chroniącego przed złośliwym kodem;"
              - "niekorzystania z urządzeń, w których usunięto zabezpieczenia producenta."
      - ustep: "Klient {powinien|jest zobowiązany} sprawdzać adres strony Banku, certyfikat zabezpieczający połączenie oraz treść komunikatu autoryzacyjnego przed potwierdzeniem dyspozycji, w tym zgodność kwoty i rachunku odbiorcy."
      - ustep: "Klient {niezwłocznie zgłasza|zobowiązany jest niezwłocznie zgłosić} Bankowi utratę, kradzież, przywłaszczenie lub nieuprawnione użycie urządzenia zaufanego, Hasła lub innych danych uwierzytelniających pod numerem {{fakt:kontakt.infolinia-zastrzezenia}}."

  - id: bankowosc-elektroniczna-oszustwa
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank prowadzi działania mające na celu ochronę Klientów przed oszustwami, w tym monitorowanie operacji pod kątem nietypowych zachowań. Bank {może|ma prawo} w tym celu wstrzymać wykonanie dyspozycji i skontaktować się z Klientem w celu jej potwierdzenia."
      - ustep: "Klient powinien {zachować|zachowywać} szczególną ostrożność w przypadku:"
        punkty:
          - "wiadomości e-mail lub SMS zawierających odnośniki do stron podszywających się pod stronę Banku;"
          - "rozmów telefonicznych, w których rozmówca przedstawia się jako pracownik Banku i prosi o instalację oprogramowania do zdalnego dostępu lub o podanie kodów;"
          - "próśb o wykonanie przelewu na rzekomo „bezpieczny” rachunek;"
          - "wezwań do pilnego potwierdzenia dyspozycji, której Klient nie składał."
      - ustep: "W razie podejrzenia oszustwa Klient {powinien|jest zobowiązany} przerwać rozmowę lub korzystanie ze strony, niezwłocznie skontaktować się z Bankiem pod numerem {{fakt:kontakt.infolinia-zastrzezenia}} i — w razie potrzeby — zawiadomić organy ścigania. Aktualne ostrzeżenia Bank publikuje na stronie {{fakt:bank.strona}} oraz w serwisie internetowym.[^1]"
    przypisy:
      1: "Bank nie ponosi odpowiedzialności za skutki przekazania danych uwierzytelniających osobie trzeciej, jeżeli do ich ujawnienia doszło z winy Klienta, na zasadach określonych w {{ref:akt:dz-u-2024-30-uslugi-platnicze}}."

  # ===== Rozdział: Blokada dostępu =====
  - id: bankowosc-elektroniczna-blokada-klient
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Klient {może|ma prawo} w każdej chwili zablokować dostęp do bankowości elektronicznej lub do aplikacji mobilnej:"
        punkty:
          - "telefonicznie pod numerem {{fakt:kontakt.infolinia-zastrzezenia}}, dostępnym {{fakt:kontakt.godziny-infolinii}};"
          - "w placówce Banku, składając pisemną dyspozycję;"
          - "w aplikacji mobilnej lub serwisie internetowym, o ile Klient ma jeszcze do nich dostęp."
      - ustep: "Zgłoszenie utraty urządzenia zaufanego powoduje zablokowanie aplikacji mobilnej na tym urządzeniu. Bank zapewnia możliwość zgłoszenia {zagrożenia|utraty} przez całą dobę; zgłoszenie jest bezpłatne."
      - ustep: "Odblokowanie dostępu następuje na wniosek Klienta po weryfikacji jego tożsamości, {{fakt:bankowosc.odblokowanie}}, chyba że przyczyna blokady nie ustała."

  - id: bankowosc-elektroniczna-blokada-bank
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {może|ma prawo} zablokować dostęp do bankowości elektronicznej lub jej poszczególnych funkcji z uzasadnionych przyczyn związanych z bezpieczeństwem, w szczególności jeżeli:"
        punkty:
          - "zachodzi podejrzenie nieuprawnionego użycia danych uwierzytelniających;"
          - "zachodzi podejrzenie umyślnego doprowadzenia do nieautoryzowanej operacji;"
          - "Klient naruszył postanowienia Regulaminu w sposób zagrażający bezpieczeństwu;"
          - "Bank został zobowiązany do tego przez przepisy prawa lub orzeczenie właściwego organu;"
          - "dostęp nie był używany przez okres dłuższy niż {{fakt:bankowosc.nieaktywnosc}}."
      - ustep: "O zablokowaniu dostępu Bank {informuje|powiadamia} Klienta przed zablokowaniem, a jeżeli nie jest to możliwe — niezwłocznie po jego dokonaniu, chyba że przekazanie takiej informacji byłoby nieuzasadnione ze względów bezpieczeństwa lub zakazane przepisami prawa.[^1]"
      - ustep: "Bank odblokowuje dostęp niezwłocznie po ustaniu przyczyny blokady. Blokada nie wpływa na prawa Klienta do rachunku i środków na nim zgromadzonych."
    przypisy:
      1: "Przesłanki blokady instrumentu płatniczego wynikają z {{ref:akt:dz-u-2024-30-uslugi-platnicze}}; Bank dokumentuje decyzję o blokadzie wraz z jej uzasadnieniem."

  # ===== Rozdział: Odpowiedzialność =====
  - id: bankowosc-elektroniczna-odpowiedzialnosc
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank odpowiada za należyte wykonanie usług bankowości elektronicznej na zasadach określonych w przepisach prawa. W szczególności Bank odpowiada za nieautoryzowane transakcje płatnicze, z zastrzeżeniem postanowień Regulaminu."
      - ustep: "Bank nie ponosi odpowiedzialności za:"
        punkty:
          - "szkody wynikające z udostępnienia przez Klienta danych uwierzytelniających osobom trzecim;"
          - "zakłócenia w działaniu sieci telekomunikacyjnych i sprzętu, za które Bank nie odpowiada;"
          - "skutki niezastosowania się przez Klienta do zaleceń bezpieczeństwa;"
          - "szkody powstałe wskutek siły wyższej lub działania organów władzy publicznej."
      - ustep: "Odpowiedzialność Banku wobec Klienta będącego konsumentem nie może być wyłączona ani ograniczona w sposób sprzeczny z bezwzględnie obowiązującymi przepisami prawa."

  - id: bankowosc-elektroniczna-nieautoryzowane
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Klient jest zobowiązany do niezwłocznego zawiadomienia Banku o stwierdzonym nieautoryzowanym, niewykonanym lub nienależycie wykonanym zleceniu płatniczym, nie później jednak niż w terminie {{fakt:termin.rachunek-osobisty.zgloszenie-nieautoryzowanej}} od dnia obciążenia rachunku."
      - ustep: "W przypadku nieautoryzowanej transakcji Bank {zwraca|dokonuje zwrotu} Klientowi kwotę transakcji {{fakt:termin.rachunek-osobisty.zwrot-nieautoryzowanej}} po stwierdzeniu transakcji albo po otrzymaniu zgłoszenia, z wyjątkiem sytuacji, gdy Bank ma uzasadnione i należycie udokumentowane podstawy do podejrzewania oszustwa i powiadomi o tym organy ścigania."
      - ustep: "Klient odpowiada za nieautoryzowane transakcje do kwoty stanowiącej równowartość 50 euro, jeżeli transakcja jest skutkiem posłużenia się utraconym lub skradzionym instrumentem płatniczym albo jego przywłaszczenia. Klient odpowiada w pełnej wysokości, jeżeli doprowadził do nieautoryzowanej transakcji umyślnie albo w wyniku rażącego niedbalstwa, w szczególności przez naruszenie obowiązków określonych w Regulaminie.[^1]"
    przypisy:
      1: "Zasady odpowiedzialności za nieautoryzowane transakcje płatnicze określa {{ref:akt:dz-u-2024-30-uslugi-platnicze}}; ocena, czy doszło do rażącego niedbalstwa, uwzględnia okoliczności konkretnego przypadku."

  # ===== Rozdział: Dostępność i przerwy =====
  - id: bankowosc-elektroniczna-dostepnosc
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank dokłada starań, aby usługi bankowości elektronicznej były dostępne {całodobowo|przez całą dobę, we wszystkie dni roku}. Dostępność może być ograniczona w związku z koniecznością przeprowadzenia prac konserwacyjnych, aktualizacji oprogramowania lub usunięcia awarii."
      - ustep: "O planowanych przerwach technicznych Bank {informuje|powiadamia} Klientów w serwisie internetowym i aplikacji mobilnej z wyprzedzeniem co najmniej {{fakt:bankowosc.przerwa-zapowiedz}}. Prace o ograniczonym zakresie są wykonywane w oknie serwisowym {{fakt:bankowosc.okno-serwisowe}} i nie wymagają odrębnego zawiadomienia. Łączny czas przerwy technicznej w jednej dobie nie powinien przekraczać {{fakt:bankowosc.przerwa-maks}}."
      - ustep: "W okresie przerwy lub awarii Klient {może|ma możliwość} składać dyspozycje w placówkach Banku lub na Infolinii. Bank nie ponosi odpowiedzialności za szkody wynikające z niedostępności usług w czasie planowanych przerw, o których Klienta należycie poinformowano."

  # ===== Rozdział: Opłaty =====
  - id: bankowosc-elektroniczna-oplaty
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Dostęp do bankowości elektronicznej oraz aplikacji mobilnej jest {udostępniany|świadczony} {bez opłat|nieodpłatnie}, tj. w wysokości {{fakt:oplata.bankowosc.dostep}} miesięcznie. Opłaty za usługi dodatkowe i czynności związane z bankowością elektroniczną określa {{ref:dokument:taryfa-bankowosc-elektroniczna}}."
      - ustep: "W szczególności opłaty dotyczą:"
        punkty:
          - "wydania tokena sprzętowego — w wysokości {{fakt:oplata.bankowosc.token}};"
          - "wydania nowego kodu aktywacyjnego — w wysokości {{fakt:oplata.bankowosc.nowy-kod-aktywacyjny}};"
          - "powiadomień SMS o transakcjach — w wysokości {{fakt:oplata.powiadomienie-sms}} za wiadomość;"
          - "przelewu natychmiastowego — w wysokości {{fakt:oplata.przelew-natychmiastowy}}."
      - ustep: "Udostępnienie wyciągu w postaci elektronicznej w bankowości elektronicznej jest realizowane w wysokości {{fakt:oplata.bankowosc.wyciag-elektroniczny}}; wyciąg w postaci papierowej podlega opłacie wynikającej z Taryfy."

  # ===== Rozdział: Postanowienia końcowe =====
  - id: bankowosc-elektroniczna-wypowiedzenie
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Klient {może|ma prawo} wypowiedzieć umowę o korzystanie z bankowości elektronicznej z zachowaniem terminu {{fakt:termin.wypowiedzenie-przez-klienta}} ze skutkiem na koniec miesiąca kalendarzowego, składając oświadczenie w placówce albo w bankowości elektronicznej."
      - ustep: "Bank może wypowiedzieć umowę z zachowaniem terminu {{fakt:termin.wypowiedzenie-przez-bank}}, jeżeli:"
        punkty:
          - "Klient rażąco naruszył Regulamin lub umowę;"
          - "Klient podał nieprawdziwe dane lub dokumenty;"
          - "dalsze świadczenie usługi byłoby sprzeczne z przepisami prawa;"
          - "Klient nie korzystał z usługi przez okres dłuższy niż {{fakt:bankowosc.nieaktywnosc}} pomimo wcześniejszego powiadomienia."
      - ustep: "Wypowiedzenie umowy o korzystanie z bankowości elektronicznej nie wpływa na umowę rachunku, chyba że obie umowy zostały wypowiedziane."

  - id: bankowosc-elektroniczna-wejscie-w-zycie
    typy: [regulaminy]
    tematy: [bankowosc-elektroniczna]
    kategoria: wymagane-bankowosc
    jednostka: "§ {n}."
    elementy:
      - ustep: "Regulamin wchodzi w życie z dniem {{param:od}} i obowiązuje {wobec|w stosunku do} wszystkich Klientów korzystających z bankowości elektronicznej."
      - ustep: "Z dniem wejścia w życie Regulaminu tracą moc dotychczasowe postanowienia regulujące korzystanie z bankowości elektronicznej, z zastrzeżeniem, że do dyspozycji złożonych przed tym dniem stosuje się zasady w nich określone. Regulamin oznaczony jest numerem {{param:oznaczenie}}, wersja {{param:wersja}}."
