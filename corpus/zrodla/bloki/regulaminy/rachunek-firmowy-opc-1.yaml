bloki:
  - id: rachunek-firmowy-tajemnica
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-ogolne
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Informacje o rachunku Posiadacza, w tym o jego saldzie, obrotach, zawartych umowach i osobach uprawnionych do dysponowania rachunkiem, stanowią tajemnicę bankową. Bank udostępnia je wyłącznie Posiadaczowi, osobom przez niego upoważnionym oraz podmiotom uprawnionym na podstawie przepisów, {w szczególności|zwłaszcza} sądom, prokuraturze, organom podatkowym i egzekucyjnym."
      - ustep: "Posiadacz {może|ma prawo} zwolnić Bank z tajemnicy bankowej w stosunku do wskazanych podmiotów, na przykład biegłego rewidenta, doradcy podatkowego lub spółki powiązanej, składając pisemne upoważnienie określające zakres informacji i okres, na jaki zostało udzielone. Upoważnienie może być w każdym czasie odwołane."
      - ustep: "Bank {może|ma prawo} przekazywać dane o zobowiązaniach Posiadacza wynikających z umowy do biur informacji gospodarczej, jeżeli zobowiązanie jest wymagalne od {co najmniej|nie mniej niż} {{fakt:termin.firma.bik-zwloka}} i Bank uprzedził Posiadacza o zamiarze przekazania danych, zgodnie z przepisami (zob. {{ref:akt:dz-u-2024-1646-prawo-bankowe}})."

  - id: rachunek-firmowy-siedziba
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-ogolne
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {wskazuje|podaje} w umowie adres siedziby, adres do doręczeń oraz dane kontaktowe osób upoważnionych do kontaktu z Bankiem, w tym numery telefonów i adresy poczty elektronicznej. Zmiana tych danych wymaga zawiadomienia Banku w terminie {{fakt:termin.firma.aktualizacja-danych}}."
      - ustep: "Korespondencję kierowaną na ostatni adres wskazany przez Posiadacza uważa się za doręczoną, {jeżeli|o ile} nie została odebrana w terminie awizo, z upływem {{fakt:termin.doreczenie-korespondencji}} od pierwszego awizowania. Skutek ten nie następuje, gdy Posiadacz udowodni, że niedoręczenie nastąpiło z przyczyn niezależnych od niego."
      - ustep: "Bank {może|ma prawo} prowadzić korespondencję w formie {elektronicznej|poczty elektronicznej}, jeżeli Posiadacz wskazał adres poczty elektronicznej lub korzysta z bankowości elektronicznej. Wiadomość uważa się za doręczoną w chwili, gdy została udostępniona w sposób umożliwiający zapoznanie się z jej treścią."

  - id: rachunek-firmowy-beneficjent-uslug
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-ogolne
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {świadczy|wykonuje} usługi w ramach rachunku firmowego z należytą starannością, uwzględniając zawodowy charakter swojej działalności. Bank {nie odpowiada|nie ponosi odpowiedzialności} za szkody powstałe wskutek siły wyższej, decyzji organów państwowych, awarii systemów rozliczeniowych niezależnych od Banku oraz przerw w dostępie do sieci telekomunikacyjnych."
      - ustep: "{Odpowiedzialność Banku|Odpowiedzialność odszkodowawcza Banku} wobec Posiadacza będącego przedsiębiorcą ogranicza się do szkody rzeczywistej, którą Bank mógł przewidzieć w chwili zawarcia umowy, i nie obejmuje utraconych korzyści, chyba że szkoda wynika z winy umyślnej Banku. Ograniczenie to nie dotyczy odpowiedzialności, której przepisy bezwzględnie obowiązujące nie pozwalają wyłączyć."
      - ustep: "Posiadacz {ponosi odpowiedzialność za|odpowiada za} skutki prawne i podatkowe operacji dokonywanych na rachunku, w tym za prawidłowość danych podanych w zleceniach i za zgodność operacji z przepisami regulującymi jego działalność."

  - id: rachunek-firmowy-sankcje
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-ogolne
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank stosuje ograniczenia wynikające z przepisów o środkach sankcyjnych oraz z polityki Banku dotyczącej ryzyka sankcji. Bank {może|ma prawo} odmówić wykonania transakcji, w której uczestniczy podmiot lub państwo objęte sankcjami, a także transakcji dotyczącej towarów lub usług objętych zakazem."
      - ustep: "Na żądanie Banku Posiadacz przedstawia dokumenty lub informacje pozwalające ocenić, czy transakcja nie narusza ograniczeń, {w szczególności|zwłaszcza} umowy z kontrahentem, faktury, dokumenty przewozowe i celne. Do czasu przedstawienia dokumentów Bank {wstrzymuje|zawiesza} realizację zlecenia, o czym informuje Posiadacza w dopuszczalnym przez prawo zakresie."
      - ustep: "Posiadacz oświadcza, że sam, jego beneficjenci rzeczywiści ani osoby go reprezentujące nie zostali objęci sankcjami, i zobowiązuje się {niezwłocznie|bez zbędnej zwłoki} powiadomić Bank o zmianie tej okoliczności."

  - id: rachunek-firmowy-konflikt
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-otwarcie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Przed zawarciem umowy Bank {przedstawia|przedkłada} Posiadaczowi informację o głównych cechach rachunku, o opłatach i prowizjach oraz o oprocentowaniu środków. Informacje przekazywane są na trwałym nośniku i obejmują {w szczególności|zwłaszcza} wysokość opłaty za prowadzenie rachunku, wynoszącą {{fakt:oplata.firma.prowadzenie-rachunku}} miesięcznie, oraz zasady zmiany opłat."
      - ustep: "Posiadacz potwierdza w umowie, że informacje otrzymał, oraz że rachunek jest przeznaczony do prowadzenia działalności gospodarczej lub zawodowej. Rachunek otwarty na podstawie niezgodnych z prawdą oświadczeń może zostać zamknięty zgodnie z rozdziałem o wypowiedzeniu umowy."
      - ustep: "Bank {może|ma prawo} uzależnić zawarcie umowy od przedstawienia zabezpieczeń, w szczególności przy udzieleniu dopuszczalnego zadłużenia na rachunku bieżącym, a {także|również} od złożenia przez Posiadacza zgody na wymianę informacji z biurami informacji gospodarczej."

  - id: rachunek-firmowy-start
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-otwarcie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Spółka w organizacji, która nie została jeszcze wpisana do rejestru, {może otworzyć|ma prawo otworzyć} rachunek tymczasowy na podstawie umowy spółki, zgłoszenia do rejestru i dokumentów tożsamości osób reprezentujących. Środki zgromadzone na takim rachunku mogą być wykorzystane wyłącznie na pokrycie wkładów oraz kosztów wpisu do rejestru, {do czasu|do momentu} przedstawienia odpisu potwierdzającego wpis."
      - ustep: "Po wpisie Posiadacza do rejestru Bank {przekształca|zmienia} rachunek tymczasowy w rachunek bieżący {na wniosek|na żądanie} Posiadacza, bez ponoszenia opłaty za otwarcie. Jeżeli wniosek o wpis zostanie prawomocnie odrzucony albo wpis nie nastąpi w terminie {{fakt:termin.firma.wpis-rejestr}}, Bank zamyka rachunek, a środki przekazuje na rachunek wskazany przez wspólników proporcjonalnie do wniesionych wkładów."
      - ustep: "Osoba prowadząca jednoosobową działalność gospodarczą {może otworzyć|ma prawo otworzyć} rachunek firmowy na podstawie wpisu do ewidencji działalności gospodarczej; w takim przypadku Bank sprawdza dane przedsiębiorcy w tej ewidencji."

  - id: rachunek-firmowy-oddzialy
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-otwarcie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz będący jednostką organizacyjną niebędącą osobą prawną albo oddziałem przedsiębiorcy zagranicznego {przedstawia|przedkłada}, oprócz dokumentów wymienionych w Regulaminie, dokumenty potwierdzające utworzenie jednostki, zakres jej zdolności prawnej oraz pełnomocnictwo do zawarcia umowy rachunku."
      - ustep: "Wspólnicy spółki cywilnej {otwierają|zakładają} rachunek na rzecz spółki, przedstawiając umowę spółki oraz dokumenty tożsamości wspólników. Bank {wymaga|żąda} podpisów wszystkich wspólników lub osoby upoważnionej przez nich w umowie spółki. Zmiana składu wspólników {wymaga|powoduje konieczność} aktualizacji dokumentów i złożenia nowej karty wzorów podpisów."
      - ustep: "Dla stowarzyszeń, fundacji i innych podmiotów niebędących przedsiębiorcami, otwarcie rachunku następuje na podstawie statutu, aktualnego odpisu z rejestru oraz uchwały organu w sprawie powołania osób uprawnionych do reprezentacji; do takich podmiotów Regulamin stosuje się odpowiednio, z wyłączeniem postanowień dotyczących rozliczeń podatku od towarów i usług."

  - id: rachunek-firmowy-zarzad
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-reprezentacja
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "{Członkowie zarządu spółki kapitałowej|Osoby wchodzące w skład zarządu spółki kapitałowej} uprawnieni do jej reprezentacji składają wzór podpisu, a Bank weryfikuje ich uprawnienia na podstawie aktualnego odpisu z rejestru i uchwał organów, o ile są wymagane. Bank {może|ma prawo} {wymagać|żądać} dodatkowo odpisu aktualnej listy wspólników lub księgi akcyjnej."
      - ustep: "Jeżeli reprezentacja zarządu jest wielostopniowa, to jest wymaga zgody rady nadzorczej lub zgromadzenia wspólników na określone czynności, Bank żąda przedstawienia uchwały i {może odmówić|ma prawo odmówić} realizacji dyspozycji {do czasu|do momentu} jej przedstawienia."
      - ustep: "W razie wygaśnięcia mandatu członka zarządu uprawniony do reprezentacji nie może składać dyspozycji od dnia, w którym Bank otrzymał dokument potwierdzający wygaśnięcie lub wykreślenie osoby z rejestru, chyba że Bank wiedział o tym wcześniej."

  - id: rachunek-firmowy-prokura
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-reprezentacja
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Prokurent jest uprawniony do dysponowania rachunkiem Posiadacza w granicach określonych w przepisach i w treści prokury, na podstawie odpisu z rejestru potwierdzającego wpis prokury. Prokurent składa wzór podpisu na karcie wzorów podpisów jak osoba reprezentująca."
      - ustep: "Prokura łączna {wymaga|oznacza konieczność} złożenia dyspozycji przez {co najmniej|nie mniej niż} dwóch prokurentów albo prokurenta i członka zarządu, zgodnie z wpisem. Bank nie przyjmuje dyspozycji prokurenta, {jeżeli|o ile} z odpisu wynika, że dokonuje on czynności poza zakresem prokury."
      - ustep: "Wygaśnięcie lub odwołanie prokury {wywołuje skutki|jest skuteczne} wobec Banku od dnia otrzymania zawiadomienia z odpisem lub oświadczeniem o odwołaniu, a w razie wykreślenia prokury z rejestru — od dnia, w którym Bank się o tym dowiedział."

  - id: rachunek-firmowy-pelnomocnik-zakres
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-reprezentacja
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {ustala|weryfikuje} tożsamość pełnomocnika i weryfikuje pełnomocnictwo w terminie {{fakt:termin.firma.weryfikacja-dokumentow}} od jego przedłożenia. Bank {może|ma prawo} odmówić przyjęcia pełnomocnictwa, {jeżeli|o ile} jego treść jest niejednoznaczna, wykracza poza zakres usług Banku lub budzi uzasadnione wątpliwości co do prawdziwości dokumentów."
      - ustep: "Pełnomocnik {jest zobowiązany do działania|ma obowiązek działać} w granicach umocowania i zgodnie z interesem Posiadacza. Bank nie bada celowości dyspozycji składanych w granicach pełnomocnictwa, chyba że wiedział o ich sprzeczności z interesem Posiadacza lub ze względu na podejrzenie nadużycia."
      - ustep: "Pełnomocnik może uzyskać dostęp do bankowości elektronicznej na zasadach określonych dla użytkowników. Rozszerzenie zakresu pełnomocnictwa o bankowość elektroniczną wymaga oddzielnego zapisu w treści pełnomocnictwa."

  - id: rachunek-firmowy-zmiana-reprezentacji
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-reprezentacja
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {zawiadamia|informuje} Bank o zmianie osób uprawnionych do reprezentacji oraz o zmianie sposobu reprezentacji w terminie {{fakt:termin.firma.aktualizacja-danych}} od dnia zmiany, przedstawiając dokumenty ją potwierdzające. Do czasu otrzymania zawiadomienia Bank {może|ma prawo} opierać się na dotychczasowych dokumentach."
      - ustep: "Wpis zmiany w rejestrze nie powoduje automatycznie zmiany uprawnień w Banku. Zmiana następuje po przyjęciu nowej karty wzorów podpisów oraz zakończeniu weryfikacji dokumentów. W okresie przejściowym Bank może ograniczyć możliwość składania dyspozycji do tych, które nie budzą wątpliwości co do umocowania."
      - ustep: "W razie sporu między osobami reprezentującymi Posiadacza co do uprawnień do dysponowania rachunkiem Bank może wstrzymać wykonanie dyspozycji {do czasu|do momentu} rozstrzygnięcia sporu przez sąd lub przedstawienia wspólnego stanowiska, {jeżeli|o ile} zachodzi ryzyko szkody."

  - id: rachunek-firmowy-kwp-elektroniczna
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-kwp
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {może|ma prawo} przyjąć kartę wzorów podpisów w postaci elektronicznej, jeżeli jej złożenie odbywa się z użyciem kwalifikowanego podpisu elektronicznego albo innego sposobu zapewniającego równoważny poziom bezpieczeństwa i identyfikacji. Karta elektroniczna wywołuje takie same skutki jak karta papierowa."
      - ustep: "Dyspozycje składane w placówce Bank {weryfikuje|sprawdza} wyłącznie na podstawie karty papierowej, chyba że Posiadacz wyraźnie zażąda weryfikacji {także|również} na podstawie karty elektronicznej. Bank {nie odpowiada|nie ponosi odpowiedzialności} za rozbieżności między treścią karty elektronicznej i papierowej, jeżeli zostały one złożone w różnym czasie, a nowsza nie została dostarczona."
      - ustep: "Karta wzorów podpisów może przewidywać limity kwotowe dla poszczególnych osób, w tym maksymalną jednorazową kwotę dyspozycji. Limity wpisane na karcie obowiązują także w bankowości elektronicznej, o ile Posiadacz nie ustali inaczej."

  - id: rachunek-firmowy-kwp-podpis
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-kwp
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Dyspozycje składane w formie papierowej powinny być podpisane w sposób zgodny z wzorem podpisu, w obecności pracownika Banku albo z podpisem poświadczonym notarialnie, {jeżeli|o ile} dyspozycja jest składana za pośrednictwem osoby trzeciej lub drogą pocztową. Opłata za weryfikację dokumentów pochodzących od osoby trzeciej nie jest pobierana."
      - ustep: "Dyspozycja opatrzona pieczęcią Posiadacza, jeżeli jej użycie zostało przewidziane w karcie wzorów podpisów, jest traktowana jako prawidłowo złożona po stwierdzeniu zgodności podpisu osoby uprawnionej. Brak pieczęci nie wpływa na ważność dyspozycji, o ile karta nie wymaga jej użycia."
      - ustep: "W razie utraty lub kradzieży pieczęci Posiadacz {niezwłocznie|bez zbędnej zwłoki} {zawiadamia|informuje} Bank i składa nową kartę wzorów podpisów ze wzorem nowej pieczęci. Bank {nie odpowiada|nie ponosi odpowiedzialności} za skutki realizacji dyspozycji opatrzonych pieczęcią użytą nieuprawnione, jeżeli zawiadomienie nie wpłynęło przed ich wykonaniem."

  - id: rachunek-firmowy-dysp-limity
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-dysponowanie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {może|ma prawo} ustalić z Bankiem limity dyspozycji składanych w poszczególnych kanałach, w tym dzienny limit przelewów, który bez odrębnej dyspozycji wynosi {{fakt:limit.firma.przelew-dzienny-domyslny}}. Limit obowiązuje łącznie dla wszystkich rachunków Posiadacza, chyba że umowa stanowi inaczej."
      - ustep: "Bank {może|ma prawo} obniżyć limit lub wstrzymać wykonanie dyspozycji, {jeżeli|o ile} uzna to za konieczne ze względu na bezpieczeństwo środków, ryzyko nadużycia lub nietypowy charakter transakcji. Obniżenie limitu następuje po poinformowaniu Posiadacza w sposób uzgodniony w umowie."
      - ustep: "Dyspozycja przekraczająca limit wymaga potwierdzenia {na piśmie|w formie pisemnej} albo odrębnej autoryzacji osoby uprawnionej do reprezentacji w trybie ustalonym przez Bank. Bank informuje o sposobie potwierdzenia przy odmowie wykonania dyspozycji."

  - id: rachunek-firmowy-dysp-blokada
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-dysponowanie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {blokuje|wstrzymuje} środki na rachunku w całości lub w części, gdy:"
        punkty:
          - "Posiadacz złoży dyspozycję blokady, na przykład w celu zabezpieczenia rozliczeń z kontrahentem;"
          - "organ egzekucyjny lub inny uprawniony organ dokona zajęcia lub zakaże wypłat;"
          - "zachodzi uzasadnione podejrzenie nieuprawnionego dostępu do rachunku lub wykorzystania go do celów niezgodnych z prawem;"
          - "właściwy organ nakaże wstrzymanie transakcji lub zablokowanie rachunku na podstawie przepisów o przeciwdziałaniu praniu pieniędzy."
      - ustep: "Blokadę zdejmuje się {niezwłocznie|bez zbędnej zwłoki} po ustaniu przyczyny, a w przypadkach wskazanych w ust. 1 pkt 2 i 4 po otrzymaniu zawiadomienia organu. Bank {informuje|powiadamia} Posiadacza o zastosowaniu blokady, chyba że przepisy zakazują takiej informacji."
      - ustep: "W okresie blokady Bank nie dokonuje wypłat z zablokowanych środków, a odsetki naliczane są według zasad ogólnych. Posiadacz {może|ma prawo} składać dyspozycje w zakresie środków niezablokowanych."

  - id: rachunek-firmowy-dysp-umowa
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-dysponowanie
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {może|ma prawo} upoważnić Bank do obciążania rachunku należnościami z tytułu zobowiązań wobec wskazanych odbiorców w formie polecenia zapłaty, wyrażając zgodę w umowie z odbiorcą lub bezpośrednio w Banku. Zgoda {zawiera|określa} dane odbiorcy, rodzaj zobowiązania oraz ewentualne limity kwotowe i terminowe."
      - ustep: "Posiadacz może w każdym czasie odwołać zgodę lub ograniczyć jej zakres najpóźniej do końca dnia roboczego poprzedzającego dzień obciążenia rachunku. Odwołanie nie zwalnia Posiadacza z zobowiązań wobec odbiorcy ani nie wpływa na skuteczność obciążeń dokonanych przed odwołaniem."
      - ustep: "Bank nie realizuje polecenia zapłaty, gdy na rachunku brak środków na jego wykonanie w dniu obciążenia lub gdy rachunek jest zablokowany. Opłata za odrzucone polecenie zapłaty jest pobierana {zgodnie z Taryfą|według Taryfy}."

  - id: rachunek-firmowy-przelewy-walutowe
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-przelewy
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Zlecenie przelewu w walucie obcej lub przelewu transgranicznego zawiera, oprócz danych podstawowych, kod identyfikacyjny banku odbiorcy (BIC lub SWIFT), numer rachunku odbiorcy w formacie IBAN lub inny właściwy dla kraju, a {także|również} informację o rodzaju opłat (podział kosztów między nadawcę i odbiorcę albo pokrycie opłat przez jedną ze stron)."
      - ustep: "Opłata za przelew w ramach jednolitego obszaru płatności w euro wynosi {{fakt:oplata.firma.przelew-sepa}}. Opłata za przelew do innych krajów lub w innych walutach obejmuje prowizję Banku oraz ewentualne opłaty banków pośredniczących i jest określona w Taryfie; opłaty pośredników Bank {obciąża|pobiera od} Posiadacza, {jeżeli|o ile} został wybrany podział kosztów obciążający nadawcę."
      - ustep: "Przelew w walucie obcej jest wykonywany po kursie ustalonym według tabeli Banku obowiązującej w chwili realizacji, jeżeli wymaga przewalutowania, z uwzględnieniem marży wynoszącej {{fakt:kurs.marza-przeliczen}}, a {na wniosek|na żądanie} Posiadacza — po kursie indywidualnym uzgodnionym przed złożeniem zlecenia."

  - id: rachunek-firmowy-przelewy-zwrot
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-przelewy
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Jeżeli przelew został wykonany na rachunek niewłaściwego odbiorcy wskutek błędnego identyfikatora podanego przez Posiadacza, Bank {podejmuje|niezwłocznie podejmuje} działania w celu odzyskania środków, bez gwarancji ich zwrotu, i {informuje|powiadamia} Posiadacza o ich wyniku. Za podjęcie czynności Bank {pobiera|nalicza} opłatę według Taryfy."
      - ustep: "Jeżeli zlecenie nie zostało wykonane lub zostało wykonane nienależycie z przyczyn leżących po stronie Banku, Bank {niezwłocznie|bez zbędnej zwłoki} zwraca Posiadaczowi kwotę transakcji i przywraca rachunek do stanu sprzed jej wykonania, chyba że Posiadacz nie zgłosił zastrzeżeń w terminie wskazanym w Regulaminie."
      - ustep: "Zwrot środków przelewu zagranicznego nastąpi po otrzymaniu ich od banku pośredniczącego lub banku odbiorcy, w kwocie pomniejszonej o opłaty tych banków oraz — w razie zwrotu w innej walucie — po kursie obowiązującym w dniu zwrotu."

  - id: rachunek-firmowy-przelewy-zlecenie-stale
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-przelewy
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {może|ma prawo} zlecić Bankowi regularne wykonywanie przelewów w stałych kwotach i terminach (zlecenie stałe) lub przelewów odroczonych (zlecenie z datą przyszłą). Zlecenie {określa|wskazuje} rachunek odbiorcy, kwotę, częstotliwość, pierwszy termin wykonania oraz, jeśli to potrzebne, termin zakończenia."
      - ustep: "Jeżeli termin wykonania zlecenia przypada w dniu niebędącym dniem roboczym, zlecenie jest wykonywane w najbliższym następnym dniu roboczym, chyba że Posiadacz wskazał inaczej. Brak środków w dniu wykonania skutkuje niewykonaniem zlecenia; Bank ponawia wykonanie zlecenia w kolejnym dniu roboczym, {jeżeli|o ile} takie ustalenie zawarto w umowie."
      - ustep: "Zmiana lub odwołanie zlecenia stałego powinny zostać złożone najpóźniej na {{fakt:termin.firma.zlecenie-stale-zmiana}} przed dniem jego wykonania. Dyspozycja złożona później wywołuje skutki od następnego terminu realizacji."

  - id: rachunek-firmowy-gotowka-koperty
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-gotowka
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Na podstawie odrębnej umowy Posiadacz {może|ma prawo} składać wpłaty gotówkowe w zamkniętych workach wpłatowych lub kopertach depozytowych, które Bank przyjmuje w placówce albo od uprawnionego konwojenta. Umowa określa zasady oznaczania worków, protokoły odbioru oraz limity zawartości."
      - ustep: "Zawartość worka jest przeliczana przez Bank w terminie {{fakt:termin.firma.przeliczenie-worka}} od przyjęcia, w obecności dwóch pracowników Banku, a wynik przeliczenia jest wiążący dla stron. Różnice między kwotą zadeklarowaną i stwierdzoną są księgowane po stronie Posiadacza w dniu przeliczenia."
      - ustep: "Bank {nie odpowiada|nie ponosi odpowiedzialności} za brak części zawartości worka, jeżeli worek nie był prawidłowo zamknięty i oznaczony, a {także|również} za szkody powstałe przed jego przyjęciem. Za usługę przyjęcia i przeliczenia worka Bank pobiera opłatę {zgodnie z Taryfą|według Taryfy}."

  - id: rachunek-firmowy-gotowka-waluty
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-gotowka
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Wpłaty i wypłaty gotówki w walutach obcych Bank realizuje w {wybranych|określonych} placówkach i w nominałach, którymi dysponuje. Wypłaty w walucie obcej wymagają awizo składanego najpóźniej do godziny {{fakt:godzina.firma.awizo-wyplaty}} dnia roboczego poprzedzającego wypłatę, niezależnie od kwoty."
      - ustep: "Bank {nie przyjmuje|odmawia przyjęcia} monet obcych, banknotów uszkodzonych w stopniu uniemożliwiającym weryfikację oraz banknotów wycofanych z obiegu. Banknoty podejrzane o sfałszowanie Bank {zatrzymuje|zabezpiecza} i przekazuje właściwym organom, sporządzając protokół wręczany wpłacającemu."
      - ustep: "Posiadacz nie może wypłacać gotówki z rachunku w złotych w celu dokonania rozliczeń z innym przedsiębiorcą, {jeżeli|o ile} wartość transakcji przekracza limity określone w przepisach, które przewidują obowiązek dokonywania płatności za pośrednictwem rachunku bankowego."

  - id: rachunek-firmowy-gotowka-wplatomaty
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-gotowka
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {może|ma prawo} dokonywać wpłat gotówkowych we wpłatomatach Banku za pomocą karty firmowej lub identyfikatora uzyskanego w bankowości elektronicznej. Wpłata jest {księgowana|zaliczana} na rachunku {niezwłocznie|bez zbędnej zwłoki} po potwierdzeniu przez urządzenie, a przy wpłatach w dniach niebędących dniami roboczymi — z datą pierwszego dnia roboczego."
      - ustep: "Dzienny limit wpłat we wpłatomacie wynosi {{fakt:limit.firma.wplatomat-dzienny}}, a pojedyncza wpłata może obejmować nie więcej niż {{fakt:limit.firma.wplatomat-banknotow}} banknotów. Wpłaty przekraczające limit realizuje się w kasie placówki."
      - ustep: "Reklamację dotyczącą wpłaty we wpłatomacie Posiadacz zgłasza z potwierdzeniem wpłaty. Bank wyjaśnia sprawę na podstawie zapisów urządzenia, a w razie stwierdzenia nadwyżki lub niedoboru dokonuje korekty rachunku, w terminie określonym w rozdziale o reklamacjach."

  - id: rachunek-firmowy-lokaty
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-pomocnicze
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Na wniosek Posiadacza Bank zakłada lokaty terminowe i lokaty typu overnight, z wykorzystaniem środków zgromadzonych na rachunku bieżącym. Warunki lokaty, w tym wysokość i sposób naliczania odsetek, okres trwania i zasady zerwania, {określa|wskazuje} potwierdzenie lokaty albo odrębna umowa; w sprawach nieuregulowanych stosuje się odpowiednio {{ref:dokument:regulamin-lokat}}, w zakresie dotyczącym przedsiębiorców."
      - ustep: "Oprocentowanie lokaty overnight wynosi {{fakt:oprocentowanie.firma.lokata-overnight}} w stosunku rocznym i jest naliczane za każdy dzień, w którym środki pozostają na lokacie. Lokata jest zakładana automatycznie na koniec dnia roboczego z nadwyżki ponad ustalone saldo minimalne i likwidowana na początku następnego dnia roboczego."
      - ustep: "Minimalna kwota lokaty terminowej wynosi {{fakt:limit.firma.lokata-minimalna}}. Zerwanie lokaty przed upływem terminu powoduje naliczenie odsetek według obniżonej stawki, a od zerwanej części Bank {może|ma prawo} pobrać opłatę {zgodnie z Taryfą|według Taryfy}."

  - id: rachunek-firmowy-karty
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-pomocnicze
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Do rachunku bieżącego Bank wydaje, {na wniosek|na żądanie} Posiadacza, karty debetowe dla wskazanych przez niego osób (użytkowników kart). Zasady użytkowania kart {określa|wskazuje} osobny dokument — {{ref:dokument:regulamin-kart-debetowych}} — w zakresie, w jakim nie sprzeciwiają się one postanowieniom niniejszego Regulaminu."
      - ustep: "Posiadacz odpowiada za transakcje dokonane wszystkimi kartami wydanymi do rachunku oraz za przestrzeganie warunków ich używania przez użytkowników. Posiadacz ustala limity dzienne dla poszczególnych kart, w tym limit transakcji gotówkowych, który bez odrębnej dyspozycji wynosi {{fakt:limit.firma.karta-gotowkowy}}."
      - ustep: "Za wydanie karty Bank {pobiera|nalicza} opłatę {{fakt:oplata.firma.karta-wydanie}}, a za jej użytkowanie opłatę roczną w wysokości {{fakt:oplata.firma.karta-roczna}}. Utratę lub kradzież karty zgłasza się całodobowo pod numerem {{fakt:kontakt.infolinia-zastrzezenia}}; po zgłoszeniu Bank blokuje kartę {niezwłocznie|bez zbędnej zwłoki}."

  - id: rachunek-firmowy-pomocnicze-celowe
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-pomocnicze
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {może|ma prawo} zlecić otwarcie rachunku pomocniczego przeznaczonego na określony cel, {w szczególności|zwłaszcza} na gromadzenie środków na zobowiązania podatkowe, wynagrodzenia, kaucje lub depozyty zabezpieczające umowy z kontrahentami. Cel rachunku jest wskazywany we wniosku i może być uwzględniony w jego nazwie."
      - ustep: "Wypłaty z rachunku celowego mogą być ograniczone do wskazanych odbiorców lub rodzajów płatności. Ograniczenie wymaga zgody Posiadacza wyrażonej w umowie; Bank {nie odpowiada|nie ponosi odpowiedzialności} za skutki wykorzystania środków wbrew wskazanemu celowi, {jeżeli|o ile} Posiadacz zmienił ograniczenie w sposób przewidziany w umowie."
      - ustep: "Rachunek celowy z ograniczeniem wypłat, ustanowiony na rzecz osoby trzeciej, jako rachunek zastrzeżony, nie podlega zmianom bez zgody tej osoby. Bank prowadzi taki rachunek na podstawie trójstronnej umowy, a odpowiedzialność za jego użycie ponoszą strony umowy."

  - id: rachunek-firmowy-bankowosc-uprawnienia
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-bankowosc
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Posiadacz {nadaje|przyznaje} użytkownikom bankowości elektronicznej jedno z uprawnień: przeglądanie, przygotowywanie dyspozycji, autoryzację samodzielną albo autoryzację łączną. Uprawnienia są nadawane w placówce Banku lub w samej bankowości przez administratora wskazanego przez Posiadacza."
      - ustep: "Dyspozycje wymagające autoryzacji łącznej {uznaje się|traktuje się} za złożone po autoryzacji przez wszystkie wymagane osoby. Dyspozycja nieautoryzowana w pełni w terminie {{fakt:termin.firma.autoryzacja-laczna}} od jej przygotowania jest odrzucana automatycznie."
      - ustep: "Administrator bankowości elektronicznej odpowiada za bieżącą aktualizację uprawnień użytkowników. Zablokowanie dostępu użytkownika {następuje|jest dokonywane} na żądanie Posiadacza zgłoszone telefonicznie lub w placówce, i {niezwłocznie|bez zbędnej zwłoki} po jego otrzymaniu."

  - id: rachunek-firmowy-bankowosc-bezpieczenstwo
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-bankowosc
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank stosuje mechanizmy bezpieczeństwa, w tym silne uwierzytelnienie, monitorowanie transakcji i limity dyspozycji. Bank {może|ma prawo} zablokować dostęp do bankowości lub wstrzymać wykonanie dyspozycji, {jeżeli|o ile} ma uzasadnione podejrzenie nieuprawnionego użycia danych uwierzytelniających lub próby oszustwa."
      - ustep: "Bank nigdy nie prosi użytkownika o podanie pełnych danych uwierzytelniających, kodu autoryzacyjnego ani o zainstalowanie oprogramowania do zdalnego sterowania urządzeniem. Użytkownik, który otrzyma takie żądanie, powinien zakończyć rozmowę i {niezwłocznie|bez zbędnej zwłoki} powiadomić Bank pod numerem {{fakt:kontakt.infolinia-zastrzezenia}}."
      - ustep: "Posiadacz zapewnia, aby urządzenia użytkowników były zabezpieczone przed nieuprawnionym dostępem i wyposażone w aktualne oprogramowanie ochronne. Koszty zakupu, konfiguracji oraz utrzymania sprzętu i oprogramowania ponosi Posiadacz."

  - id: rachunek-firmowy-bankowosc-awarie
    typy: [regulaminy]
    tematy: [rachunek-firmowy]
    kategoria: paragraf-rf-bankowosc
    wspolny: false
    jednostka: "§ {n}."
    elementy:
      - ustep: "Bank {może|ma prawo} okresowo wyłączać bankowość elektroniczną ze względu na prace konserwacyjne lub modernizację, z zachowaniem terminu uprzedzającego, {jeżeli|o ile} jest to możliwe. Informacje o planowanych przerwach Bank publikuje w serwisie transakcyjnym i na stronie {{fakt:bank.strona}}."
      - ustep: "W razie niedostępności bankowości Posiadacz {może|ma prawo} składać dyspozycje w placówce lub telefonicznie, po uwierzytelnieniu na zasadach określonych przez Bank. Bank {nie odpowiada|nie ponosi odpowiedzialności} za szkody wynikające z przerw, jeżeli podjął działania niezbędne do ich usunięcia w terminie technicznie możliwym."
      - ustep: "Bank przechowuje dane o dyspozycjach składanych w bankowości elektronicznej i udostępnia je Posiadaczowi na żądanie. Zapisy komputerowe Banku stanowią dowód złożenia dyspozycji, chyba że Posiadacz wykaże ich nieprawidłowość."
