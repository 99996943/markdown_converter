fakty:
  # --- tożsamość banku
  - id: bank.adres
    rodzaj: tekst
    wartosci:
      - wartosc: "ul. Przykładowa 1, 00-001 Warszawa"
    alternatywy: ["ul. Przykładowa 15, 00-002 Warszawa"]
  - id: bank.krs
    rodzaj: tekst
    wartosci:
      - wartosc: "0000000000"
  - id: bank.nip
    rodzaj: tekst
    wartosci:
      - wartosc: "000-000-00-00"
  - id: bank.regon
    rodzaj: tekst
    wartosci:
      - wartosc: "000000000"
  - id: bank.strona
    rodzaj: tekst
    wartosci:
      - wartosc: "https://bank.example"
    alternatywy: ["https://bank-przyklad.invalid"]
  - id: bank.kapital-zakladowy
    rodzaj: kwota
    wartosci:
      - wartosc: 650000000.00
      - od: 2027-01-01
        wartosc: 700000000.00
    alternatywy: [500000000.00]

  # --- kontakt
  - id: kontakt.infolinia
    rodzaj: tekst
    wartosci:
      - wartosc: "800 000 001"
    alternatywy: ["800 000 099"]
  - id: kontakt.infolinia-zastrzezenia
    rodzaj: tekst
    wartosci:
      - wartosc: "800 000 002"
    alternatywy: ["800 000 098"]
  - id: kontakt.infolinia-zagranica
    rodzaj: tekst
    wartosci:
      - wartosc: "+48 800 000 003"
  - id: kontakt.godziny-infolinii
    rodzaj: tekst
    wartosci:
      - wartosc: "codziennie przez całą dobę"
      - od: 2026-04-01
        wartosc: "w dni robocze od 7:00 do 21:00"
    alternatywy: ["w dni robocze od 8:00 do 18:00"]
  - id: kontakt.email-reklamacje
    rodzaj: tekst
    wartosci:
      - wartosc: "reklamacje@bank.example"
    alternatywy: ["skargi@bank.example"]
  - id: kontakt.email-iod
    rodzaj: tekst
    wartosci:
      - wartosc: "iod@bank.example"
  - id: kontakt.adres-korespondencyjny
    rodzaj: tekst
    wartosci:
      - wartosc: "Bank Przykładowy S.A., Biuro Reklamacji, ul. Przykładowa 1, 00-001 Warszawa"
    alternatywy: ["Bank Przykładowy S.A., skrytka pocztowa 100, 00-950 Warszawa"]

  # --- jednostki organizacyjne
  - id: jednostka.zarzad
    rodzaj: tekst
    wartosci:
      - wartosc: "Zarząd Banku"
  - id: jednostka.zgodnosc
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Zgodności"
    alternatywy: ["Biuro Zgodności"]
  - id: jednostka.operacje
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Operacji"
    alternatywy: ["Departament Operacji Bankowych"]
  - id: jednostka.reklamacje
    rodzaj: tekst
    wartosci:
      - wartosc: "Biuro Reklamacji"
    alternatywy: ["Zespół Reklamacji"]
  - id: jednostka.bezpieczenstwo
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Bezpieczeństwa"
  - id: jednostka.ryzyko
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Ryzyka"
  - id: jednostka.prawny
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Prawny"
  - id: jednostka.iod
    rodzaj: tekst
    wartosci:
      - wartosc: "Inspektor Ochrony Danych"
  - id: jednostka.obsluga-klienta
    rodzaj: tekst
    wartosci:
      - wartosc: "Departament Obsługi Klienta"
    alternatywy: ["Centrum Obsługi Klienta"]

  # --- terminy
  - id: termin.reklamacja.rozpatrzenie
    rodzaj: termin
    wartosci:
      - wartosc: 15
    alternatywy: [30, 14]
  - id: termin.reklamacja.przedluzenie
    rodzaj: termin
    wartosci:
      - wartosc: 35
    alternatywy: [45]
  - id: termin.reklamacja.platnicze
    rodzaj: termin
    wartosci:
      - wartosc: 15
    alternatywy: [30]
  - id: termin.reklamacja.inne
    rodzaj: termin
    wartosci:
      - wartosc: 30
    alternatywy: [14, 21]
  - id: termin.reklamacja.maksymalny
    rodzaj: termin
    wartosci:
      - wartosc: 60
    alternatywy: [90]
  - id: termin.zmiana-regulaminu
    rodzaj: termin
    wartosci:
      - wartosc: 60
      - od: 2027-01-01
        wartosc: 30
    alternatywy: [14]
  - id: termin.odstapienie-od-umowy
    rodzaj: termin
    wartosci:
      - wartosc: 14
    alternatywy: [30]
  - id: termin.wypowiedzenie-przez-klienta
    rodzaj: termin
    wartosci:
      - wartosc: 30
    alternatywy: [14, 60]
  - id: termin.wypowiedzenie-przez-bank
    rodzaj: termin
    wartosci:
      - wartosc: 60
    alternatywy: [30]
  - id: termin.doreczenie-korespondencji
    rodzaj: termin
    wartosci:
      - wartosc: 14
    alternatywy: [7, 21]
  - id: termin.zwrot-oplat
    rodzaj: termin
    wartosci:
      - wartosc: 14
    alternatywy: [30]

  # --- opłaty ogólne
  - id: oplata.zaswiadczenie
    rodzaj: kwota
    wartosci:
      - wartosc: 20.00
      - od: 2027-01-01
        wartosc: 25.00
    alternatywy: [0.00, 40.00]
  - id: oplata.duplikat-umowy
    rodzaj: kwota
    wartosci:
      - wartosc: 30.00
    alternatywy: [0.00, 50.00]
  - id: oplata.wyciag-papierowy
    rodzaj: kwota
    wartosci:
      - wartosc: 10.00
      - od: 2026-04-01
        wartosc: 12.00
    alternatywy: [0.00]
  - id: oplata.przelew-zewnetrzny-placowka
    rodzaj: kwota
    wartosci:
      - wartosc: 8.00
      - od: 2027-01-01
        wartosc: 10.00
    alternatywy: [0.00, 15.00]
  - id: oplata.przelew-natychmiastowy
    rodzaj: kwota
    wartosci:
      - wartosc: 5.00
    alternatywy: [0.00, 9.00]
  - id: oplata.wplata-gotowkowa
    rodzaj: kwota
    wartosci:
      - wartosc: 3.00
    alternatywy: [0.00]
  - id: oplata.powiadomienie-sms
    rodzaj: kwota
    wartosci:
      - wartosc: 2.00
      - od: 2026-04-01
        wartosc: 3.00
  - id: oplata.upomnienie
    rodzaj: kwota
    wartosci:
      - wartosc: 15.00
    alternatywy: [25.00]
  - id: oplata.karta.zastrzezenie
    rodzaj: kwota
    wartosci:
      - wartosc: 0.00
    alternatywy: [25.00, 30.00]
  - id: oplata.karta.wydanie-duplikatu
    rodzaj: kwota
    wartosci:
      - wartosc: 25.00
      - od: 2026-04-01
        wartosc: 30.00
    alternatywy: [0.00, 45.00]
  - id: oplata.prowadzenie-rachunku
    rodzaj: kwota
    wartosci:
      - wartosc: 9.00
      - od: 2027-01-01
        wartosc: 12.00
    alternatywy: [0.00, 15.00]
  - id: oplata.bankomat-obcy
    rodzaj: kwota
    wartosci:
      - wartosc: 5.00
      - od: 2026-04-01
        wartosc: 6.00
    alternatywy: [0.00, 8.00]

  # --- oprocentowanie
  - id: oprocentowanie.rachunek-oszczednosciowy
    rodzaj: procent
    wartosci:
      - wartosc: 3.5
      - od: 2026-04-01
        wartosc: 3.0
    alternatywy: [5.0, 1.0]
  - id: oprocentowanie.lokata-3m
    rodzaj: procent
    wartosci:
      - wartosc: 4.0
      - od: 2026-04-01
        wartosc: 3.75
    alternatywy: [6.0]
  - id: oprocentowanie.lokata-6m
    rodzaj: procent
    wartosci:
      - wartosc: 4.2
    alternatywy: [6.2]
  - id: oprocentowanie.lokata-12m
    rodzaj: procent
    wartosci:
      - wartosc: 4.4
    alternatywy: [6.4]
  - id: oprocentowanie.rachunek-osobisty
    rodzaj: procent
    wartosci:
      - wartosc: 0.1
    alternatywy: [1.0]
  - id: oprocentowanie.debet
    rodzaj: procent
    wartosci:
      - wartosc: 18.5
      - od: 2027-01-01
        wartosc: 17.5
    alternatywy: [24.0]
  - id: oprocentowanie.odsetki-za-opoznienie
    rodzaj: procent
    wartosci:
      - wartosc: 17.0
      - od: 2027-01-01
        wartosc: 16.5
    alternatywy: [20.0]

  # --- limity
  - id: limit.karta.dzienny-gotowkowy
    rodzaj: kwota
    wartosci:
      - wartosc: 5000.00
    alternatywy: [2000.00, 10000.00]
  - id: limit.karta.dzienny-bezgotowkowy
    rodzaj: kwota
    wartosci:
      - wartosc: 15000.00
      - od: 2027-01-01
        wartosc: 20000.00
    alternatywy: [5000.00]
  - id: limit.platnosci-mobilne.dzienny
    rodzaj: kwota
    wartosci:
      - wartosc: 5000.00
    alternatywy: [1000.00, 10000.00]
  - id: limit.przelew-dzienny-domyslny
    rodzaj: kwota
    wartosci:
      - wartosc: 20000.00
      - od: 2027-01-01
        wartosc: 25000.00
    alternatywy: [10000.00, 50000.00]

  # --- Bankowy Fundusz Gwarancyjny, Rzecznik Finansowy
  - id: bfg.gwarancja
    rodzaj: tekst
    wartosci:
      - wartosc: "równowartość 100 000 euro"
    alternatywy: ["równowartość 50 000 euro"]
  - id: rzecznik.strona
    rodzaj: tekst
    wartosci:
      - wartosc: "https://rzecznik-finansowy.example"
    alternatywy: ["https://rzecznik.invalid"]

  # --- przeliczenia walut i daty
  - id: kurs.marza-przeliczen
    rodzaj: procent
    wartosci:
      - wartosc: 1.5
    alternatywy: [2.5]
  - id: kurs.godzina-tabeli
    rodzaj: tekst
    wartosci:
      - wartosc: "9:00"
    alternatywy: ["15:00"]
  - id: data.wejscie-w-zycie-regulaminow
    rodzaj: data
    wartosci:
      - wartosc: 2026-01-01
    alternatywy: [2027-01-01]
